name: Build TornPulse Google Play Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      TORNPULSE_UPLOAD_STORE_PASSWORD: ${{ secrets.TORNPULSE_UPLOAD_STORE_PASSWORD }}
      TORNPULSE_UPLOAD_KEY_ALIAS: ${{ secrets.TORNPULSE_UPLOAD_KEY_ALIAS }}
      TORNPULSE_UPLOAD_KEY_PASSWORD: ${{ secrets.TORNPULSE_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Play upload key
        env:
          TORNPULSE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TORNPULSE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$TORNPULSE_UPLOAD_KEYSTORE_BASE64"
          test -n "$TORNPULSE_UPLOAD_STORE_PASSWORD"
          test -n "$TORNPULSE_UPLOAD_KEY_ALIAS"
          test -n "$TORNPULSE_UPLOAD_KEY_PASSWORD"
          printf '%s' "$TORNPULSE_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tornpulse-upload-key.jks"
          echo "TORNPULSE_UPLOAD_STORE_FILE=$RUNNER_TEMP/tornpulse-upload-key.jks" >> "$GITHUB_ENV"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Run TornPulse self-test
        run: npm run selftest

      - name: Apply v0.8.1 refinement
        run: node patch-v081.cjs

      - name: Apply v0.8.2 Health + Status HUD
        run: node patch-v082.cjs

      - name: Apply v0.9.0 release candidate
        run: node patch-v090.cjs

      - name: Apply v1.0.0 final release
        run: node patch-v100.cjs

      - name: Apply approved thin right-edge HUD
        run: node patch-v100-hud.cjs

      - name: Apply TornPulse header and colors
        run: node patch-v101-brand-colors.cjs

      - name: Add in-app Torn Chat Hub
        run: node patch-v110-chat-hub.cjs

      - name: Verify store-ready source
        run: |
          grep -q "config.version = '1.0.0';" app.config.js
          grep -q "versionCode: 23," app.config.js
          grep -q "const PACKAGE_NAME = 'com.tornpulse.app';" app.config.js
          grep -q "TORNPULSE 1.0" app.config.js
          grep -q "eventTickerText" app.config.js
          grep -q "GlowSpan" app.config.js
          grep -q "MUGGED BY" app.config.js
          grep -q "RELEASED FROM HOSPITAL" app.config.js
          grep -q "tornpulse-header.png" app.config.js
          grep -q "val minWidthDp = 100" app.config.js
          grep -q "Gravity.END" app.config.js
          grep -q "TORNPULSE_CHAT_HUB_V1" app.config.js
          grep -q "FACTION CHAT" app.config.js
          grep -q "GLOBAL CHAT" app.config.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify native v1.0 HUD
        run: |
          HUD=android/app/src/main/java/com/tornpulse/app/ComfortableOverlayService.kt
          grep -q 'TornPulse/1.0.0' "$HUD"
          grep -q 'hud_preset' "$HUD"
          grep -q 'eventTickerText' "$HUD"
          grep -q 'GlowSpan' "$HUD"
          grep -q 'statusText' "$HUD"
          grep -q 'ImageView' "$HUD"
          grep -q 'import android.widget.ImageView' "$HUD"
          grep -q 'MUGGED BY' "$HUD"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Bundle checksum
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify release signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload TornPulse Google Play Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v1.0.0-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
