name: Build TornPulse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Run TornPulse self-test
        run: npm run selftest

      - name: Apply v0.8.1 refinement
        run: node patch-v081.cjs

      - name: Apply v0.8.2 Health + Status HUD
        run: node patch-v082.cjs

      - name: Apply v0.9.0 release candidate
        run: node patch-v090.cjs

      - name: Apply v1.0.0 final release
        run: node patch-v100.cjs

      - name: Verify v1.0.0 patch
        run: |
          grep -q "config.version = '1.0.0';" app.config.js
          grep -q "versionCode: 23," app.config.js
          grep -q "TORNPULSE 1.0" app.config.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify native v1.0 HUD
        run: |
          grep -q 'TornPulse/1.0.0' android/app/src/main/java/com/comfortableai/torncopilot/ComfortableOverlayService.kt
          grep -q 'hud_preset' android/app/src/main/java/com/comfortableai/torncopilot/ComfortableOverlayService.kt

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: APK checksum
        run: sha256sum android/app/build/outputs/apk/release/app-release.apk

      - name: Upload TornPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v1.0.0-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
