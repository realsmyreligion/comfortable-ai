          for name,data in ICONS.items():
              raw=base64.b64decode(data)
              if raw[:8]!=b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(name+' is not a PNG')
              Path(name).write_bytes(raw)
              print('✓ installed '+name)

          cfgp=Path('app.config.js')
          cfg=cfgp.read_text()
          m=re.search(r'const OVERLAY_SERVICE_KT = ("(?:\\.|[^"\\])*");',cfg)
          if not m:
              raise SystemExit('OVERLAY_SERVICE_KT not found')
          service=json.loads(m.group(1))

          mapping={
              'TP_DRUG_ICON':'tp-drug.png',
              'TP_BOOSTER_ICON':'tp-booster.png',
              'TP_MEDICAL_ICON':'tp-medical.png',
          }

          for const_name,filename in mapping.items():
              encoded=base64.b64encode(Path(filename).read_bytes()).decode()
              p=re.compile(r'(private val '+re.escape(const_name)+r' = ")([A-Za-z0-9+/=]+)(")')
              if not p.search(service):
                  raise SystemExit(const_name+' not found in native HUD')
              service=p.sub(lambda x:x.group(1)+encoded+x.group(3),service,count=1)

          cfg=cfg[:m.start(1)]+json.dumps(service)+cfg[m.end(1):]
          cfgp.write_text(cfg)
          print('✅ Exact Drug / Booster / Medical icons installed; backgrounds are transparent')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt')
          s=p.read_text()

          if 'TORNPULSE_IMMERSIVE_NAV_RC9' not in s:
              e=s.find('\n',s.find('package '))
              if e<0:raise SystemExit('package declaration not found')

              s=s[:e+1]+(
                  'import androidx.core.view.WindowCompat\n'
                  'import androidx.core.view.WindowInsetsCompat\n'
                  'import androidx.core.view.WindowInsetsControllerCompat\n'
              )+s[e+1:]

              end=s.rfind('\n}')
              if end<0:raise SystemExit('class ending not found')

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC9
            private fun applyTornPulseNav() {
              val c = WindowCompat.getInsetsController(window, window.decorView)
              c.hide(WindowInsetsCompat.Type.navigationBars())
              c.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) applyTornPulseNav()
            }
          '''
              s=s[:end]+code+s[end:]
              s=s.replace(
                  'super.onCreate(null)',
                  'super.onCreate(null)\n    window.decorView.post { applyTornPulseNav() }',
                  1
              )
              p.write_text(s)
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc9-exact-torn-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
