          from pathlib import Path
          from PIL import Image
          import base64,json,hashlib

          files={
              'TP_DRUG_ICON':'tp-drug.png',
              'TP_BOOSTER_ICON':'tp-booster.png',
              'TP_MEDICAL_ICON':'tp-medical.png',
          }

          for filename in files.values():
              p=Path(filename)
              with Image.open(p) as im:
                  im.load()
                  if im.mode!='RGBA' or im.size!=(96,96):
                      raise SystemExit(f'{filename}: expected 96x96 RGBA, got {im.mode} {im.size}')
                  if im.getchannel('A').getextrema()[0] != 0:
                      raise SystemExit(filename+': transparent background missing')
              print('✓ verified',filename,hashlib.sha256(p.read_bytes()).hexdigest()[:16])

          def embedded(src,name):
              prefix='const '+name+' = '
              i=src.find(prefix)
              if i<0:return None
              s=i+len(prefix)
              if s>=len(src) or src[s]!='"':return None
              j=s+1
              esc=False
              while j<len(src):
                  c=src[j]
                  if esc:esc=False
                  elif c=='\\':esc=True
                  elif c=='"':break
                  j+=1
              return s,j+1,json.loads(src[s:j+1])

          def set_embedded(src,name,value):
              found=embedded(src,name)
              if not found:raise SystemExit(name+' not found')
              s,e,_=found
              return src[:s]+json.dumps(value)+src[e:]

          cfgp=Path('app.config.js')
          cfg=cfgp.read_text()
          found=embedded(cfg,'OVERLAY_SERVICE_KT')
          if not found:raise SystemExit('OVERLAY_SERVICE_KT not found')
          service=found[2]

          for constant,filename in files.items():
              encoded=base64.b64encode(Path(filename).read_bytes()).decode('ascii')
              needle='private val '+constant+' = "'
              i=service.find(needle)
              if i<0:raise SystemExit(constant+' not found in floating HUD')
              a=i+len(needle)
              b=service.find('"',a)
              if b<0:raise SystemExit(constant+' closing quote not found')
              service=service[:a]+encoded+service[b:]

          cfg=set_embedded(cfg,'OVERLAY_SERVICE_KT',service)
          cfgp.write_text(cfg)
          print('✅ Verified exact Drug / Booster / Medical icons installed in app + HUD')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify generated TornPulse Android PNG resources
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          wanted={'tpdrug.png','tpbooster.png','tpmedical.png'}
          found=[]
          for path in Path('android/app/src/main/res').rglob('*.png'):
              if path.name.lower() not in wanted:
                  continue
              with Image.open(path) as im:
                  im.load()
                  if im.mode!='RGBA':
                      raise SystemExit(f'{path}: expected RGBA, got {im.mode}')
              found.append(str(path))
              print('✓ valid '+str(path))
          if len(found)<3:
              raise SystemExit(f'Expected 3 TornPulse cooldown PNG resources, found {len(found)}')
          print('✅ Generated Android cooldown resources are valid RGBA PNGs')
          PY

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt')
          s=p.read_text()

          if 'TORNPULSE_IMMERSIVE_NAV_RC12' not in s:
              e=s.find('\n',s.find('package '))
              if e<0:raise SystemExit('package declaration not found')

              s=(
                  s[:e+1]
                  +'import androidx.core.view.WindowCompat\n'
                  +'import androidx.core.view.WindowInsetsCompat\n'
                  +'import androidx.core.view.WindowInsetsControllerCompat\n'
                  +s[e+1:]
              )

              end=s.rfind('\n}')
              if end<0:raise SystemExit('MainActivity class ending not found')

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC12
            private fun applyTornPulseNav() {
              val c=WindowCompat.getInsetsController(window,window.decorView)
              c.hide(WindowInsetsCompat.Type.navigationBars())
              c.systemBarsBehavior=
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(hasFocus:Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if(hasFocus) applyTornPulseNav()
            }
          '''

              s=s[:end]+code+s[end:]
              s=s.replace(
                  'super.onCreate(null)',
                  'super.onCreate(null)\n    window.decorView.post { applyTornPulseNav() }',
                  1
              )
              p.write_text(s)
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc12-verified-exact-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
