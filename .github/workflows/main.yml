      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build ARM64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK integrity and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"
          unzip -t "$APK" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | head -n 20

          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload TornPulse RC4 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc4-alert-sync-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
