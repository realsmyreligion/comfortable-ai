                wlt: 86,
                business: 52
              }
            },

            uae: {
              name: 'United Arab Emirates',
              city: 'Dubai',
              flag: '🇦🇪',
              fare: 32000,
              times: {
                standard: 257,
                airstrip: 180,
                wlt: 129,
                business: 77
