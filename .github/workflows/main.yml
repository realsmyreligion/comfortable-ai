      - name: Harden TornPulse alert synchronization
        shell: bash
        run: |
          cat > /tmp/tornpulse-alert-sync-rc4.cjs <<'TORNPULSE_ALERT_SYNC'
          const fs = require('fs');

          const APP_FILE = 'App.js';
          const CONFIG_FILE = 'app.config.js';
          const NOTIFY_FILE = 'notifications.js';
          const SRC_NOTIFY_FILE = 'src/notifications.js';
          const MARKER = 'TORNPULSE_RC4_ALERT_SYNC';

          function mustReplace(text, oldText, newText, label) {
            if (text.includes(newText)) return text;
            if (!text.includes(oldText)) {
              throw new Error(`RC4: ${label} anchor not found`);
            }
            console.log(`✓ ${label}`);
            return text.replace(oldText, newText);
          }

          function extractEmbedded(src, name) {
            const prefix = `const ${name} = `;
            const start = src.indexOf(prefix);

            if (start < 0) return null;

            const valueStart = start + prefix.length;

            if (src[valueStart] !== '"') return null;

            let i = valueStart + 1;
            let escaped = false;

            for (; i < src.length; i++) {
              const ch = src[i];

              if (escaped) {
                escaped = false;
                continue;
              }

              if (ch === '\\') {
                escaped = true;
                continue;
              }

              if (ch === '"') break;
            }

            if (i >= src.length) return null;

            return {
              start: valueStart,
              end: i + 1,
              value: JSON.parse(src.slice(valueStart, i + 1)),
            };
          }

          function setEmbedded(src, name, value) {
            const found = extractEmbedded(src, name);

            if (!found) {
              throw new Error(`RC4: embedded ${name} not found`);
            }

            return (
              src.slice(0, found.start) +
              JSON.stringify(value) +
              src.slice(found.end)
            );
          }

          const notifications = `import {Platform} from 'react-native';
          import * as Notifications from 'expo-notifications';

          // ${MARKER}
          // One reconciler owns every scheduled TornPulse reminder.
          const CHANNEL = 'torn-alerts';
          const SOURCE = 'tornpulse';
          const OUR_SOURCES = new Set(['tornpulse', 'comfortable-ai']);
          const MIN_SCHEDULE_LEAD_MS = 6000;

          Notifications.setNotificationHandler({
            handleNotification: async () => ({
              shouldPlaySound: true,
              shouldSetBadge: false,
              shouldShowBanner: true,
              shouldShowList: true,
            }),
          });

          export async function prepareNotifications() {
            if (Platform.OS === 'android') {
              await Notifications.setNotificationChannelAsync(CHANNEL, {
                name: 'Torn Alerts',
                importance: Notifications.AndroidImportance.MAX,
                sound: 'default',
                vibrationPattern: [0, 300, 150, 300],
              });
            }

            const current =
              await Notifications.getPermissionsAsync();

            if (current.granted) return true;

            const requested =
              await Notifications.requestPermissionsAsync();

            return requested.granted;
          }

          export async function getNotificationPermission() {
            const current =
              await Notifications.getPermissionsAsync();

            return Boolean(current.granted);
          }

          export async function clearTornPulseAlerts() {
            const scheduled =
              await Notifications.getAllScheduledNotificationsAsync();

            await Promise.all(
              scheduled
                .filter(x =>
                  OUR_SOURCES.has(x.content.data?.source)
                )
                .map(x =>
                  Notifications.cancelScheduledNotificationAsync(
                    x.identifier
                  )
                )
            );
          }

          function unixDate(unixSeconds) {
            const value = Number(unixSeconds || 0);

            return value > 0
              ? new Date(value * 1000)
              : null;
          }

          function futureDateFromSnapshot(snapshot, seconds) {
            const base =
              Number(snapshot?.fetchedAt || Date.now());

            return new Date(
              base +
              Math.max(0, Number(seconds || 0)) * 1000
            );
          }

          function validFuture(date) {
            return (
              date instanceof Date &&
              Number.isFinite(date.getTime()) &&
              date.getTime() >
                Date.now() + MIN_SCHEDULE_LEAD_MS
            );
          }

          function clampWarningDate(
            targetDate,
            warningMinutes
          ) {
            if (!(targetDate instanceof Date)) {
              return null;
            }

            const normal = new Date(
              targetDate.getTime() -
              Math.max(
                0,
                Number(warningMinutes || 0)
              ) *
                60_000
            );

            if (validFuture(normal)) {
              return normal;
            }

            if (
              targetDate.getTime() >
              Date.now() + 15_000
            ) {
              return new Date(Date.now() + 7000);
            }

            return null;
          }

          async function schedule(
            title,
            body,
            date,
            kind,
            snapshot,
            eventKey = ''
          ) {
            if (!validFuture(date)) return null;

            const profileId =
              snapshot?.profile?.id == null
                ? ''
                : String(snapshot.profile.id);

            return Notifications.scheduleNotificationAsync({
              content: {
                title,
                body,
                sound: 'default',
                data: {
                  source: SOURCE,
                  kind,
                  profileId,
                  eventKey: String(eventKey || ''),
                },
              },

              trigger: {
                type:
                  Notifications
                    .SchedulableTriggerInputTypes.DATE,
                date,
                channelId: CHANNEL,
              },
            });
          }

          function travelArrival(snapshot) {
            const travel = snapshot?.travel;

            if (!travel) return 0;

            const direct = Number(
              travel.arrival ||
              travel.arrival_at ||
              0
            );

            if (direct > 0) return direct;

            const left = Number(
              travel.time_left || 0
            );

            return left > 0
              ? Math.floor(
                  Number(
                    snapshot?.fetchedAt ||
                    Date.now()
                  ) / 1000
                ) + left
              : 0;
          }

          function travelActive(
            snapshot,
            arrivalUnix
          ) {
            const travel = snapshot?.travel;

            if (
              !travel ||
              arrivalUnix <=
                Math.floor(Date.now() / 1000)
            ) {
              return false;
            }

            if (
              typeof travel.active === 'boolean'
            ) {
              return travel.active;
            }

            return (
              Number(travel.time_left || 0) > 0
            );
          }

          export async function scheduleSnapshotAlerts(
            snapshot,
            settings = {}
          ) {
            // Any new Torn snapshot invalidates old alarms.
            await clearTornPulseAlerts();

            if (!snapshot || snapshot.demo) return;

            const energyMax = Number(
              snapshot.energy?.maximum || 0
            );

            const energyCurrent = Number(
              snapshot.energy?.current || 0
            );

            const energyFull = unixDate(
              snapshot.energy?.full_time
            );

            if (
              energyFull &&
              energyCurrent < energyMax
            ) {
              const warning =
                clampWarningDate(
                  energyFull,
                  settings.energyWarningMinutes ??
                    15
                );

              if (warning) {
                await schedule(
                  'ϟ Energy warning',
                  'Energy reaches cap in ' +
                    (settings.energyWarningMinutes ??
                      15) +
                    ' minutes.',
                  warning,
                  'energy-warning',
                  snapshot,
                  snapshot.energy.full_time
                );
              }

              await schedule(
                'ϟ Energy full',
                'Your Energy is full.',
                energyFull,
                'energy-full',
                snapshot,
                snapshot.energy.full_time
              );
            }

            const nerveMax = Number(
              snapshot.nerve?.maximum || 0
            );

            const nerveCurrent = Number(
              snapshot.nerve?.current || 0
            );

            const nerveFull = unixDate(
              snapshot.nerve?.full_time
            );

            if (
              nerveFull &&
              nerveCurrent < nerveMax
            ) {
              const warning =
                clampWarningDate(
                  nerveFull,
                  settings.nerveWarningMinutes ??
                    15
                );

              if (warning) {
                await schedule(
                  '✺ Nerve warning',
                  'Nerve reaches cap in ' +
                    (settings.nerveWarningMinutes ??
                      15) +
                    ' minutes.',
                  warning,
                  'nerve-warning',
                  snapshot,
                  snapshot.nerve.full_time
                );
              }

              await schedule(
                '✺ Nerve full',
                'Your Nerve is full.',
                nerveFull,
                'nerve-full',
                snapshot,
                snapshot.nerve.full_time
              );
            }

            if (
              settings.cooldownAlerts !== false
            ) {
              for (
                const [kind, title, body] of [
                  [
                    'drug',
                    '💊 Drug ready',
                    'Your drug cooldown is clear.',
                  ],
                  [
                    'booster',
                    '🥤 Booster ready',
                    'Your booster cooldown is clear.',
                  ],
                  [
                    'medical',
                    '✚ Medical ready',
                    'Your medical cooldown is clear.',
                  ],
                ]
              ) {
                const seconds = Number(
                  snapshot.cooldowns?.[kind] ||
                    0
                );

                if (seconds > 5) {
                  await schedule(
                    title,
                    body,
                    futureDateFromSnapshot(
                      snapshot,
                      seconds
                    ),
                    kind,
                    snapshot,
                    String(
                      snapshot.fetchedAt || 0
                    ) +
                      ':' +
                      String(seconds)
                  );
                }
              }
            }

            if (
              settings.statusAlerts !== false
            ) {
              const state = String(
                snapshot.status?.state || ''
              ).toLowerCase();

              const until = Number(
                snapshot.status?.until || 0
              );

              if (
                (
                  state.includes('hospital') ||
                  state.includes('jail')
                ) &&
                until > 0
              ) {
                const label =
                  state.includes('hospital')
                    ? 'Hospital'
                    : 'Jail';

                await schedule(
                  '✓ ' + label + ' release',
                  'Your ' +
                    label.toLowerCase() +
                    ' timer has ended.',
                  unixDate(until),
                  'status-release',
                  snapshot,
                  label + ':' + String(until)
                );
              }
            }

            const arrival =
              travelArrival(snapshot);

            if (
              travelActive(snapshot, arrival)
            ) {
              const destination = String(
                snapshot.travel?.destination ||
                'your destination'
              );

              const departed = Number(
                snapshot.travel?.departed ||
                snapshot.travel?.departed_at ||
                0
              );

              const flightKey =
                String(departed) +
                ':' +
                String(arrival) +
                ':' +
                destination;

              const arrivalDate =
                unixDate(arrival);

              const warning =
                clampWarningDate(
                  arrivalDate,
                  5
                );

              if (warning) {
                await schedule(
                  '✈ Landing soon',
                  'You are expected to land in ' +
                    destination +
                    ' in about 5 minutes.',
                  warning,
                  'travel-5m',
                  snapshot,
                  flightKey
                );
              }
            }
          }
          `;

          fs.writeFileSync(
            NOTIFY_FILE,
            notifications,
            'utf8'
          );

          fs.mkdirSync('src', {
            recursive: true,
          });

          fs.writeFileSync(
            SRC_NOTIFY_FILE,
            notifications,
            'utf8'
          );

          console.log(
            '✓ unified notification reconciler installed'
          );

          let app =
            fs.readFileSync(
              APP_FILE,
              'utf8'
            );

          if (!app.includes(MARKER)) {
            app = mustReplace(
              app,
              "import {getNotificationPermission, prepareNotifications, scheduleSnapshotAlerts} from './src/notifications';",
              "import {clearTornPulseAlerts, getNotificationPermission, prepareNotifications, scheduleSnapshotAlerts} from './src/notifications';\n// " +
                MARKER,
              'notification cleanup import'
            );

            app = mustReplace(
              app,
              "  const [notificationReady, setNotificationReady] = useState(false);",
              "  const [notificationReady, setNotificationReady] = useState(false);\n  const [precisionAlarmReady, setPrecisionAlarmReady] = useState(Platform.OS !== 'android');",
              'precision alarm state'
            );

            app = mustReplace(
              app,
              "    const notifications=await getNotificationPermission().catch(()=>false);\n    setNotificationReady(Boolean(notifications));",
              "    const notifications=await getNotificationPermission().catch(()=>false);\n    setNotificationReady(Boolean(notifications));\n    if (Platform.OS==='android' && ComfortableOverlay?.canScheduleExactAlarms) {\n      const exact=await ComfortableOverlay.canScheduleExactAlarms().catch(()=>false);\n      setPrecisionAlarmReady(Boolean(exact));\n    }",
              'system exact-alarm check'
            );

            app = mustReplace(
              app,
              "      const notifications=await prepareNotifications().catch(()=>false);\n      if (live) setNotificationReady(Boolean(notifications));",
              "      const notifications=await prepareNotifications().catch(()=>false);\n      if (live) setNotificationReady(Boolean(notifications));\n      if (Platform.OS==='android' && ComfortableOverlay?.canScheduleExactAlarms) {\n        const exact=await ComfortableOverlay.canScheduleExactAlarms().catch(()=>false);\n        if (live) setPrecisionAlarmReady(Boolean(exact));\n      }",
              'startup exact-alarm check'
            );

            app = mustReplace(
              app,
              "    const id=setInterval(()=>sync(null,false).catch(()=>{}),120000);",
              "    const id=setInterval(()=>sync(null,false).catch(()=>{}),60000);",
              'main Torn sync 120s → 60s'
            );

            app = mustReplace(
              app,
              "  async function disconnect() { await stopHud().catch(()=>{}); await clearApiKey(); setActivePage('DASHBOARD'); setSnapshot(null); setError(''); }",
              "  async function disconnect() { await stopHud().catch(()=>{}); await clearTornPulseAlerts().catch(()=>{}); await clearApiKey(); setActivePage('DASHBOARD'); setSnapshot(null); setError(''); }",
              'cancel alerts on disconnect/account change'
            );

            const resetAnchor =
              "  async function resetHudPosition() {\n    if (!ComfortableOverlay?.resetHudPosition) return;\n    await ComfortableOverlay.resetHudPosition().catch(()=>{});\n  }";

            const precisionFn =
              `${resetAnchor}

  async function requestPrecisionAlarms() {
    if (
      Platform.OS!=='android' ||
      !ComfortableOverlay?.requestExactAlarmPermission
    ) return;

    await ComfortableOverlay
      .requestExactAlarmPermission()
      .catch(()=>{});
  }`;

            app = mustReplace(
              app,
              resetAnchor,
              precisionFn,
              'precision alarm settings action'
            );

            const diagOld =
              '<DiagnosticRow label="NOTIFICATIONS" value={notificationReady?\'PERMISSION GRANTED\':\'PERMISSION NEEDED\'} tone={notificationReady?\'live\':\'warn\'}/><Pressable onPress={()=>refreshSystemState().catch(()=>{})} style={styles.nOutline}><Text style={styles.nOutlineText}>REFRESH SYSTEM CHECK</Text></Pressable>';

            const diagNew =
              '<DiagnosticRow label="NOTIFICATIONS" value={notificationReady?\'PERMISSION GRANTED\':\'PERMISSION NEEDED\'} tone={notificationReady?\'live\':\'warn\'}/>{Platform.OS===\'android\'?<DiagnosticRow label="PRECISION ALARMS" value={precisionAlarmReady?\'ENABLED\':\'ENABLE FOR ON-TIME ALERTS\'} tone={precisionAlarmReady?\'live\':\'warn\'}/>:null}{Platform.OS===\'android\'&&!precisionAlarmReady?<Pressable onPress={requestPrecisionAlarms} style={styles.nOutline}><Text style={styles.nOutlineText}>ENABLE PRECISE ALERTS</Text></Pressable>:null}<Pressable onPress={()=>refreshSystemState().catch(()=>{})} style={styles.nOutline}><Text style={styles.nOutlineText}>REFRESH SYSTEM CHECK</Text></Pressable>';

            app = mustReplace(
              app,
              diagOld,
              diagNew,
              'precision alarm diagnostic'
            );
          }

          fs.writeFileSync(
            APP_FILE,
            app,
            'utf8'
          );

          console.log(
            '✓ App.js alert sync hardening installed'
          );

          let config =
            fs.readFileSync(
              CONFIG_FILE,
              'utf8'
            );

          config = mustReplace(
            config,
            "    ensurePermission(manifest, 'android.permission.POST_NOTIFICATIONS');",
            "    ensurePermission(manifest, 'android.permission.POST_NOTIFICATIONS');\n    ensurePermission(manifest, 'android.permission.SCHEDULE_EXACT_ALARM');",
            'Android exact-alarm manifest permission'
          );

          let moduleKt =
            extractEmbedded(
              config,
              'OVERLAY_MODULE_KT'
            )?.value;

          if (!moduleKt) {
            throw new Error(
              'RC4: OVERLAY_MODULE_KT not found'
            );
          }

          if (
            !moduleKt.includes(
              'fun canScheduleExactAlarms'
            )
          ) {
            const anchor =
              `  @ReactMethod
  fun startHud(apiKey: String, promise: Promise) {`;

            const methods =
              `  @ReactMethod
  fun canScheduleExactAlarms(promise: Promise) {
    if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
      promise.resolve(true)
      return
    }

    try {
      val alarmManager =
        appContext.getSystemService(
          Context.ALARM_SERVICE
        ) as android.app.AlarmManager

      promise.resolve(
        alarmManager.canScheduleExactAlarms()
      )
    } catch (_: Exception) {
      promise.resolve(false)
    }
  }

  @ReactMethod
  fun requestExactAlarmPermission(promise: Promise) {
    if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
      promise.resolve(true)
      return
    }

    try {
      val alarmManager =
        appContext.getSystemService(
          Context.ALARM_SERVICE
        ) as android.app.AlarmManager

      if (
        alarmManager.canScheduleExactAlarms()
      ) {
        promise.resolve(true)
        return
      }

      val intent = Intent(
        Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
        Uri.parse(
          "package:\${appContext.packageName}"
        )
      ).apply {
        addFlags(
          Intent.FLAG_ACTIVITY_NEW_TASK
        )
      }

      appContext.startActivity(intent)
      promise.resolve(false)
    } catch (e: Exception) {
      promise.reject(
        "EXACT_ALARM_SETTINGS",
        "Unable to open precise alarm settings.",
        e
      )
    }
  }

${anchor}`;

            if (!moduleKt.includes(anchor)) {
              throw new Error(
                'RC4: startHud anchor not found in native module'
              );
            }

            moduleKt =
              moduleKt.replace(
                anchor,
                methods
              );

            config =
              setEmbedded(
                config,
                'OVERLAY_MODULE_KT',
                moduleKt
              );

            console.log(
              '✓ native exact-alarm permission bridge installed'
            );
          }

          fs.writeFileSync(
            CONFIG_FILE,
            config,
            'utf8'
          );

          console.log(
            '✅ TornPulse RC4 alert sync hardening ready'
          );
          TORNPULSE_ALERT_SYNC

          node /tmp/tornpulse-alert-sync-rc4.cjs

          grep -q 'TORNPULSE_RC4_ALERT_SYNC' App.js
          grep -q 'SCHEDULE_EXACT_ALARM' app.config.js
          grep -q 'travel-5m' notifications.js
          grep -q 'status-release' notifications.js
          grep -q '60000' App.js
