                >
                  <Text
                    style={
                      styles.eyebrow
                    }
                  >
                    BEST CURRENT RUN
                  </Text>

                  <Text
                    style={
                      styles.bestTitle
                    }
                  >
                    No profitable stocked
                    run
                  </Text>
                </View>
              );
            }

            return (
              <View
                style={[
                  styles.bestCard,
                  {
                    borderColor:
                      C.green +
                      '55'
                  }
                ]}
              >
                <View
                  style={
                    styles.between
                  }
                >
                  <Text
                    style={
                      styles.eyebrow
                    }
                  >
                    BEST CURRENT RUN
                  </Text>

                  <Badge
                    color={
                      item.arrival ===
                      'LIKELY'
                        ? C.green
                        : C.amber
                    }
                  >
                    {item.arrival}
                  </Badge>
                </View>

                <Text
                  style={
                    styles.bestTitle
                  }
                >
                  {item.flag}{' '}
                  {item.country}
                </Text>

                <Text
                  style={
                    styles.bestItem
                  }
                >
                  {item.name}
                </Text>

                <View
                  style={
                    styles.bestMetrics
                  }
                >
                  <View
                    style={
                      styles.metric
                    }
                  >
                    <Text
                      style={
                        styles.metricLabel
                      }
                    >
                      LOAD
                    </Text>

                    <Text
                      style={
                        styles.metricValue
                      }
                    >
                      {Math.min(
                        capacityValue,
                        item.quantity
                      )}
                      /
                      {capacityValue}
                    </Text>
                  </View>

                  <View
                    style={
                      styles.metric
                    }
                  >
                    <Text
                      style={
                        styles.metricLabel
                      }
                    >
                      PROFIT
                    </Text>

                    <Text
                      style={[
                        styles.metricValue,
                        {
                          color:
                            C.green
                        }
                      ]}
                    >
                      {shortMoney(
                        item
                          .projectedProfit ??
                        item
                          .loadProfit
                      )}
                    </Text>
                  </View>

                  <View
                    style={
                      styles.metric
                    }
                  >
                    <Text
                      style={
                        styles.metricLabel
                      }
                    >
                      FLIGHT
                    </Text>

                    <Text
                      style={
                        styles.metricValue
                      }
                    >
                      {item.minutes}m
                    </Text>
                  </View>
                </View>
              </View>
            );
          }

          function ItemRow({
            item,
            prices,
            settings,
            velocity,
            now,
            expanded,
            onToggle
          }) {
            const result =
              getCandidate(
                item,
                prices,
                settings,
                velocity
              );

            const feed =
              freshness(
                item.updated,
                now
              );

            const available =
              item.quantity > 0;

            return (
              <View
                style={
                  styles.item
                }
              >
                <Pressable
                  onPress={
                    onToggle
                  }
                  style={
                    styles.itemButton
                  }
                >
                  <View
                    style={
                      styles.itemTop
                    }
                  >
                    <View
                      style={
                        styles.itemNameWrap
                      }
                    >
                      <View
                        style={[
                          styles.dot,
                          {
                            backgroundColor:
                              available
                                ? C.green
                                : C.red
                          }
                        ]}
                      />

                      <Text
                        numberOfLines={
                          1
                        }
                        style={
                          styles.itemName
                        }
                      >
                        {item.name}
                      </Text>
                    </View>

                    <View
                      style={
                        styles.itemStockWrap
                      }
                    >
                      <Text
                        style={[
                          styles.stock,
                          {
                            color:
                              available
                                ? C.text
                                : C.red
                          }
                        ]}
                      >
                        {available
                          ? item.quantity.toLocaleString()
                          : 'OUT'}
                      </Text>

                      <Text
                        style={
                          styles.arrow
                        }
                      >
                        {expanded
                          ? '▲'
                          : '▼'}
                      </Text>
                    </View>
                  </View>

                  <View
                    style={
                      styles.priceRow
                    }
                  >
                    <Text
                      style={
                        styles.price
                      }
                    >
                      Buy{' '}
                      {money(
                        item.foreignPrice
                      )}
                    </Text>

                    <Text
                      style={
                        styles.price
                      }
                    >
                      Torn{' '}
                      {result
                        .marketPrice
                        ? money(
                            result
                              .marketPrice
                          )
                        : '—'}
                    </Text>

                    <Text
                      style={[
                        styles.price,
                        result
                            .profitEach >
                          0 && {
                          color:
                            C.green
                        }
                      ]}
                    >
                      {result
                        .marketPrice
                        ? (
                            result
                              .profitEach >=
                            0
                              ? '+'
                              : ''
                          ) +
                          money(
                            result
                              .profitEach
                          ) +
                          '/ea'
                        : 'Profit —'}
                    </Text>
                  </View>
                </Pressable>

                {expanded ? (
                  <View
                    style={
                      styles.itemDetails
                    }
                  >
                    <View
                      style={
                        styles.detail
                      }
                    >
                      <Text
                        style={
                          styles.detailLabel
                        }
                      >
                        LOAD PROFIT
                      </Text>

                      <Text
                        style={[
                          styles.detailValue,
                          result
                              .loadProfit >
                            0 && {
                            color:
                              C.green
                          }
                        ]}
                      >
                        {result
                          .marketPrice
                          ? shortMoney(
                              result
                                .loadProfit
                            )
                          : '—'}
                      </Text>
                    </View>

                    <View
                      style={
                        styles.detail
                      }
                    >
                      <Text
                        style={
                          styles.detailLabel
                        }
                      >
                        ONE WAY
                      </Text>

                      <Text
                        style={
                          styles.detailValue
                        }
                      >
                        {result.minutes}m
                      </Text>
                    </View>

                    <View
                      style={
                        styles.detail
                      }
                    >
                      <Text
                        style={
                          styles.detailLabel
                        }
                      >
                        ARRIVAL
                      </Text>

                      <Text
                        style={[
                          styles.detailValue,
                          {
                            color:
                              result.arrival ===
                              'LIKELY'
                                ? C.green
                                : result.arrival ===
                                    'SOLD OUT' ||
                                  result.arrival ===
                                    'UNLIKELY'
                                ? C.red
                                : C.amber
                          }
                        ]}
                      >
                        {result.arrival}
                      </Text>
                    </View>

                    <View
                      style={
                        styles.detail
                      }
                    >
                      <Text
                        style={
                          styles.detailLabel
                        }
                      >
                        FEED
                      </Text>

                      <Text
                        style={[
                          styles.detailValue,
                          {
                            color:
                              feed.color
                          }
                        ]}
                      >
                        {feed.label}
                      </Text>
                    </View>
                  </View>
                ) : null}
              </View>
            );
          }

          function CountryCard({
            group,
            prices,
            settings,
            velocity,
            now,
            expanded,
            onToggle,
            expandedItems,
            setExpandedItems
          }) {
            const feed =
              freshness(
                group.updated,
                now
              );

            const visible =
              settings
                .hideSoldOut
                ? group.items.filter(
                    item =>
                      item.quantity >
                      0
                  )
                : group.items;

            const stocked =
              group.items.filter(
                item =>
                  item.quantity >
                  0
              ).length;

            const units =
              group.items.reduce(
                (
                  total,
                  item
                ) =>
                  total +
                  item.quantity,
                0
              );

            return (
              <View
                style={
                  styles.country
                }
              >
                <Pressable
                  onPress={
                    onToggle
                  }
                  style={
                    styles.countryHeader
                  }
                >
                  <View
                    style={
                      styles.countryLeft
                    }
                  >
                    <Text
                      style={
                        styles.flag
                      }
                    >
                      {group.flag}
                    </Text>

                    <View
                      style={{
                        flex: 1,
                        minWidth: 0
                      }}
                    >
                      <Text
                        style={
                          styles.countryName
                        }
                        numberOfLines={
                          1
                        }
                      >
                        {group.name}
                      </Text>

                      <Text
                        style={
                          styles.countrySub
                        }
                        numberOfLines={
                          1
                        }
                      >
                        {group.city}
                        {' • '}
                        {stocked} stocked
                        {' • '}
                        {units.toLocaleString()}
                        {' units'}
                      </Text>
                    </View>
                  </View>

                  <View
                    style={
                      styles.countryRight
                    }
                  >
                    <Text
                      style={
                        styles.flightTime
                      }
                    >
                      {getFlightMinutes(
                        group
                          .countryCode,
                        settings
                      )}
                      m
                    </Text>

                    <Text
                      style={[
                        styles.feedStatus,
                        {
                          color:
                            feed.color
                        }
                      ]}
                    >
                      {feed.label}
                    </Text>

                    <Text
                      style={
                        styles.arrow
                      }
                    >
                      {expanded
                        ? '▲'
                        : '▼'}
                    </Text>
                  </View>
                </Pressable>

                {expanded ? (
                  <View
                    style={
                      styles.countryItems
                    }
                  >
                    {visible.map(
                      item => (
                        <ItemRow
                          key={
                            item.key
                          }
                          item={
                            item
                          }
                          prices={
                            prices
                          }
                          settings={
                            settings
                          }
                          velocity={
                            velocity
                          }
                          now={
                            now
                          }
                          expanded={
                            Boolean(
                              expandedItems[
                                item
                                  .key
                              ]
                            )
                          }
                          onToggle={
                            () =>
                              setExpandedItems(
                                current => ({
                                  ...current,

                                  [item
                                    .key]:
                                    !current[
                                      item
                                        .key
                                    ]
                                })
                              )
                          }
                        />
                      )
                    )}

                    {!visible.length ? (
                      <Text
                        style={
                          styles.empty
                        }
                      >
                        All items currently
                        sold out.
                      </Text>
                    ) : null}
                  </View>
                ) : null}
              </View>
            );
          }

          function MarketScreen({
            groups,
            best,
            capacityValue,
            prices,
            settings,
            velocity,
            now,
            search,
            setSearch,
            syncing,
            error,
            expandedCountries,
            setExpandedCountries,
            expandedItems,
            setExpandedItems
          }) {
            const query =
              search
                .trim()
                .toLowerCase();

            const filtered =
              groups
                .map(
                  group => ({
                    ...group,

                    items:
                      group.items.filter(
                        item =>
                          !query ||
                          group.name
                            .toLowerCase()
                            .includes(
                              query
                            ) ||
                          group.city
                            .toLowerCase()
                            .includes(
                              query
                            ) ||
                          item.name
                            .toLowerCase()
                            .includes(
                              query
                            )
                      )
                  })
                )
                .filter(
                  group =>
                    group.items.length >
                    0
                );

            const expandAll =
              () => {
                const next = {};

                for (
                  const group
                  of filtered
                ) {
                  next[
                    group
                      .countryCode
                  ] = true;
                }

                setExpandedCountries(
                  next
                );
              };

            const collapseAll =
              () => {
                setExpandedCountries(
                  {}
                );

                setExpandedItems(
                  {}
                );
              };

            const header = (
              <>
                <BestCard
                  item={
                    best
                  }
                  capacityValue={
                    capacityValue
                  }
                  priceReady={
                    Object.keys(
                      prices
                    ).length > 0
                  }
                />

                <View
                  style={
                    styles.search
                  }
                >
                  <Text
                    style={
                      styles.searchIcon
                    }
                  >
                    ⌕
                  </Text>

                  <TextInput
                    value={
                      search
                    }
                    onChangeText={
                      setSearch
                    }
                    placeholder="Search country or item"
                    placeholderTextColor={
                      C.faint
                    }
                    style={
                      styles.searchInput
                    }
                  />

                  {search ? (
                    <Pressable
                      onPress={
                        () =>
                          setSearch(
                            ''
                          )
                      }
                    >
                      <Text
                        style={
                          styles.clear
                        }
                      >
                        ×
                      </Text>
                    </Pressable>
                  ) : null}
                </View>

                <View
                  style={
                    styles.marketHeading
                  }
                >
                  <View>
                    <Text
                      style={
                        styles.eyebrow
                      }
                    >
                      WORLD STOCK
                    </Text>

                    <Text
                      style={
                        styles.sectionTitle
                      }
                    >
                      Foreign market
                    </Text>
                  </View>

                  {syncing ? (
                    <ActivityIndicator
                      color={
                        C.cyan
                      }
                    />
                  ) : null}
                </View>

                <View
                  style={
                    styles.toolbar
                  }
                >
                  <Text
                    style={
                      styles.toolbarInfo
                    }
                  >
                    {filtered.length}{' '}
                    destinations
                  </Text>

                  <View
                    style={
                      styles.toolbarActions
                    }
                  >
                    <Pressable
                      onPress={
                        expandAll
                      }
                      style={
                        styles.toolbarButton
                      }
                    >
                      <Text
                        style={
                          styles.toolbarText
                        }
                      >
                        EXPAND ALL
                      </Text>
                    </Pressable>

                    <Pressable
                      onPress={
                        collapseAll
                      }
                      style={
                        styles.toolbarButton
                      }
                    >
                      <Text
                        style={
                          styles.toolbarText
                        }
                      >
                        COLLAPSE
                      </Text>
                    </Pressable>
                  </View>
                </View>

                {error ? (
                  <View
                    style={
                      styles.error
                    }
                  >
                    <Text
                      style={
                        styles.errorTitle
                      }
                    >
                      FEED ISSUE
                    </Text>

                    <Text
                      style={
                        styles.errorText
                      }
                    >
                      {error}
                    </Text>
                  </View>
                ) : null}
              </>
            );

            return (
              <FlatList
                data={
                  filtered
                }
                keyExtractor={
                  item =>
                    item.countryCode
                }
                ListHeaderComponent={
                  header
                }
                renderItem={({
                  item
                }) => {
                  const expanded =
                    Boolean(
                      query
                    ) ||
                    Boolean(
                      expandedCountries[
                        item
                          .countryCode
                      ]
                    );

                  return (
                    <CountryCard
                      group={
                        item
                      }
                      prices={
                        prices
                      }
                      settings={
                        settings
                      }
                      velocity={
                        velocity
                      }
                      now={
                        now
                      }
                      expanded={
                        expanded
                      }
                      onToggle={
                        () =>
                          setExpandedCountries(
                            current => ({
                              ...current,

                              [item
                                .countryCode]:
                                !current[
                                  item
                                    .countryCode
                                ]
                            })
                          )
                      }
                      expandedItems={
                        expandedItems
                      }
                      setExpandedItems={
                        setExpandedItems
                      }
                    />
                  );
                }}
                contentContainerStyle={
                  styles.list
                }
                keyboardShouldPersistTaps="handled"
                initialNumToRender={
                  8
                }
                windowSize={
                  9
                }
                removeClippedSubviews={
                  false
                }
                extraData={{
                  expandedCountries,
                  expandedItems,
                  prices,
                  now
                }}
              />
            );
          }

          function TripsScreen({
            trips,
            capacityValue,
            priceReady
          }) {
            const header = (
              <View>
                <Text
                  style={
                    styles.eyebrow
                  }
                >
                  TRIP RANKING
                </Text>

                <Text
                  style={
                    styles.sectionTitle
                  }
                >
                  Best destinations
                </Text>

                <Text
                  style={
                    styles.copy
                  }
                >
                  {priceReady
                    ? 'Ranked using projected load profit per travel minute.'
                    : 'Connect Torn prices to enable profit ranking.'}
                </Text>
              </View>
            );

            return (
              <FlatList
                data={
                  trips
                }
                keyExtractor={
                  item =>
                    item.countryCode
                }
                ListHeaderComponent={
                  header
                }
                contentContainerStyle={
                  styles.list
                }
                renderItem={({
                  item,
                  index
                }) => (
                  <View
                    style={
                      styles.trip
                    }
                  >
                    <View
                      style={
                        styles.rank
                      }
                    >
                      <Text
                        style={
                          styles.rankText
                        }
                      >
                        {index + 1}
                      </Text>
                    </View>

                    <View
                      style={{
                        flex: 1
                      }}
                    >
                      <View
                        style={
                          styles.between
                        }
                      >
                        <Text
                          style={
                            styles.tripCountry
                          }
                        >
                          {item.flag}{' '}
                          {item.country}
                        </Text>

                        <Text
                          style={[
                            styles.arrival,
                            {
                              color:
                                item.arrival ===
                                'LIKELY'
                                  ? C.green
                                  : C.amber
                            }
                          ]}
                        >
                          {item.arrival}
                        </Text>
                      </View>

                      <Text
                        style={
                          styles.tripItem
                        }
                        numberOfLines={
                          1
                        }
                      >
                        {item.name}
                      </Text>

                      <View
                        style={
                          styles.tripBottom
                        }
                      >
                        <Text
                          style={
                            styles.tripMeta
                          }
                        >
                          {item.minutes}m
                        </Text>

                        <Text
                          style={
                            styles.tripMeta
                          }
                        >
                          {Math.min(
                            capacityValue,
                            item.quantity
                          )}{' '}
                          items
                        </Text>

                        {item
                          .projectedProfit !==
                        null ? (
                          <Text
                            style={[
                              styles.tripMeta,
                              {
                                color:
                                  C.green
                              }
                            ]}
                          >
                            {shortMoney(
                              item
                                .projectedProfit
                            )}
                          </Text>
                        ) : null}
                      </View>
                    </View>
                  </View>
                )}
              />
            );
          }

          function Toggle({
            label,
            description,
            value,
            onPress
          }) {
            return (
              <Pressable
                onPress={
                  onPress
                }
                style={
                  styles.settingRow
                }
              >
                <View
                  style={{
                    flex: 1
                  }}
                >
                  <Text
                    style={
                      styles.settingName
                    }
                  >
                    {label}
                  </Text>

                  <Text
                    style={
                      styles.settingDescription
                    }
                  >
                    {description}
                  </Text>
                </View>

                <View
                  style={[
                    styles.toggle,
                    value &&
                      styles.toggleOn
                  ]}
                >
                  <Text
                    style={[
                      styles.toggleText,
                      value && {
                        color:
                          C.green
                      }
                    ]}
                  >
                    {value
                      ? 'ON'
                      : 'OFF'}
                  </Text>
                </View>
              </Pressable>
            );
          }

          function Choice({
            value,
            options,
            onChange
          }) {
            return (
              <View
                style={
                  styles.choices
                }
              >
                {options.map(
                  option => (
                    <Pressable
                      key={
                        option.value
                      }
                      onPress={
                        () =>
                          onChange(
                            option.value
                          )
                      }
                      style={[
                        styles.choice,
                        value ===
                          option.value &&
                          styles.choiceOn
                      ]}
                    >
                      <Text
                        style={[
                          styles.choiceText,
                          value ===
                            option.value && {
                            color:
                              C.cyan
                          }
                        ]}
                      >
                        {option.label}
                      </Text>
                    </Pressable>
                  )
                )}
              </View>
            );
          }

          function SettingsScreen({
            settings,
            updateSettings,
            apiInput,
            setApiInput,
            apiKey,
            saveApiKey,
            priceSyncing
          }) {
            return (
              <ScrollView
                contentContainerStyle={
                  styles.settings
                }
                keyboardShouldPersistTaps="handled"
              >
                <Text
                  style={
                    styles.eyebrow
                  }
                >
                  TRAVEL PROFILE
                </Text>

                <Text
                  style={
                    styles.sectionTitle
                  }
                >
                  Settings
                </Text>

                <Text
                  style={
                    styles.groupTitle
                  }
                >
                  TORN MARKET PRICES
                </Text>

                <View
                  style={
                    styles.settingsCard
                  }
                >
                  <Text
                    style={
                      styles.settingName
                    }
                  >
                    Torn API key
                  </Text>

                  <TextInput
                    value={
                      apiInput
                    }
                    onChangeText={
                      setApiInput
                    }
                    placeholder="Paste API key"
                    placeholderTextColor={
                      C.faint
                    }
                    secureTextEntry
                    autoCapitalize="none"
                    autoCorrect={
                      false
                    }
                    style={
                      styles.apiInput
                    }
                  />

                  <Pressable
                    onPress={
                      saveApiKey
                    }
                    style={
                      styles.saveButton
                    }
                  >
                    <Text
                      style={
                        styles.saveText
                      }
                    >
                      {priceSyncing
                        ? 'SYNCING...'
                        : apiKey
                        ? 'SAVE & SYNC'
                        : 'CONNECT PRICES'}
                    </Text>
                  </Pressable>
                </View>

                <Text
                  style={
                    styles.groupTitle
                  }
                >
                  CAPACITY
                </Text>

                <View
                  style={
                    styles.settingsCard
                  }
                >
                  <View
                    style={
                      styles.settingRow
                    }
                  >
                    <View
                      style={{
                        flex: 1
                      }}
                    >
                      <Text
                        style={
                          styles.settingName
                        }
                      >
                        Normal capacity
                      </Text>

                      <Text
                        style={
                          styles.settingDescription
                        }
                      >
                        Base carrying limit
                      </Text>
                    </View>

                    <View
                      style={
                        styles.numberControl
                      }
                    >
                      <Pressable
                        onPress={
                          () =>
                            updateSettings({
                              baseCapacity:
                                Math.max(
                                  1,
                                  settings
                                    .baseCapacity -
                                    1
                                )
                            })
                        }
                        style={
                          styles.numberButton
                        }
                      >
                        <Text
                          style={
                            styles.numberButtonText
                          }
                        >
                          −
                        </Text>
                      </Pressable>

                      <Text
                        style={
                          styles.numberValue
                        }
                      >
                        {
                          settings
                            .baseCapacity
                        }
                      </Text>

                      <Pressable
                        onPress={
                          () =>
                            updateSettings({
                              baseCapacity:
                                settings
                                  .baseCapacity +
                                1
                            })
                        }
                        style={
                          styles.numberButton
                        }
                      >
                        <Text
                          style={
                            styles.numberButtonText
                          }
                        >
                          +
                        </Text>
                      </Pressable>
                    </View>
                  </View>

                  <Toggle
                    label="Tourism x2"
                    description={
                      'Effective capacity: ' +
                      getCapacity(
                        settings
                      )
                    }
                    value={
                      settings
                        .tourismMode
                    }
                    onPress={
                      () =>
                        updateSettings({
                          tourismMode:
                            !settings
                              .tourismMode
                        })
                    }
                  />
                </View>

                <Text
                  style={
                    styles.groupTitle
                  }
                >
                  FLIGHT METHOD
                </Text>

                <View
                  style={
                    styles.settingsCard
                  }
                >
                  <Choice
                    value={
                      settings
                        .flightMode
                    }
                    onChange={
                      flightMode =>
                        updateSettings({
                          flightMode
                        })
                    }
                    options={[
                      {
                        value:
                          'standard',
                        label:
                          'Standard'
                      },
                      {
                        value:
                          'airstrip',
                        label:
                          'Airstrip'
                      },
                      {
                        value:
                          'wlt',
                        label:
                          'WLT'
                      },
                      {
                        value:
                          'business',
                        label:
                          'Business'
                      }
                    ]}
                  />

                  <Toggle
                    label="Mailing Yourself Abroad"
                    description="Use reduced travel times"
                    value={
                      settings
                        .mailingBook
                    }
                    onPress={
                      () =>
                        updateSettings({
                          mailingBook:
                            !settings
                              .mailingBook
                        })
                    }
                  />
                </View>

                <Text
                  style={
                    styles.groupTitle
                  }
                >
                  MARKET DISPLAY
                </Text>

                <View
                  style={
                    styles.settingsCard
                  }
                >
                  <Toggle
                    label="Hide sold-out items"
                    description="Only show currently available stock"
                    value={
                      settings
                        .hideSoldOut
                    }
                    onPress={
                      () =>
                        updateSettings({
                          hideSoldOut:
                            !settings
                              .hideSoldOut
                        })
                    }
                  />

                  <Text
                    style={
                      styles.settingName
                    }
                  >
                    Refresh speed
                  </Text>

                  <Choice
                    value={
                      settings
                        .refreshSeconds
                    }
                    onChange={
                      refreshSeconds =>
                        updateSettings({
                          refreshSeconds
                        })
                    }
                    options={[
                      {
                        value: 15,
                        label:
                          '15 sec'
                      },
                      {
                        value: 30,
                        label:
                          '30 sec'
                      },
                      {
                        value: 60,
                        label:
                          '60 sec'
                      }
                    ]}
                  />
                </View>
              </ScrollView>
            );
          }

          function BottomNav({
            tab,
            setTab
          }) {
            const tabs = [
              [
                'MARKET',
                '⌁'
              ],
              [
                'TRIPS',
                '✈'
              ],
              [
                'SETTINGS',
                '⚙'
              ]
            ];

            return (
              <View
                style={
                  styles.nav
                }
              >
                {tabs.map(
                  ([
                    name,
                    icon
                  ]) => (
                    <Pressable
                      key={
                        name
                      }
                      onPress={
                        () =>
                          setTab(
                            name
                          )
                      }
                      style={
                        styles.navItem
                      }
                    >
                      {tab ===
                      name ? (
                        <View
                          style={
                            styles.navLine
                          }
                        />
                      ) : null}

                      <Text
                        style={[
                          styles.navIcon,
                          tab ===
                            name && {
                            color:
                              C.cyan
                          }
                        ]}
                      >
                        {icon}
                      </Text>

                      <Text
                        style={[
                          styles.navText,
                          tab ===
                            name && {
                            color:
                              C.cyan
                          }
                        ]}
                      >
                        {name}
                      </Text>
                    </Pressable>
                  )
                )}
              </View>
            );
          }

          export default function App() {
            const [
              tab,
              setTab
            ] =
              useState(
                'MARKET'
              );

            const [
              rows,
              setRows
            ] =
              useState([]);

            const [
              prices,
              setPrices
            ] =
              useState({});

            const [
              settings,
              setSettings
            ] =
              useState(
                DEFAULT_SETTINGS
              );

            const [
              apiKey,
              setApiKey
            ] =
              useState('');

            const [
              apiInput,
              setApiInput
            ] =
              useState('');

            const [
              search,
              setSearch
            ] =
              useState('');

            const [
              expandedCountries,
              setExpandedCountries
            ] =
              useState({});

            const [
              expandedItems,
              setExpandedItems
            ] =
              useState({});

            const [
              syncing,
              setSyncing
            ] =
              useState(true);

            const [
              priceSyncing,
              setPriceSyncing
            ] =
              useState(false);

            const [
              error,
              setError
            ] =
              useState('');

            const [
              now,
              setNow
            ] =
              useState(
                Date.now()
              );

            const [
              velocity,
              setVelocity
            ] =
              useState({});

            const previousRef =
              useRef({});

            const velocityRef =
              useRef({});

            const mountedRef =
              useRef(true);

            const refreshForeign =
              useCallback(
                async (
                  spinner = true
                ) => {
                  if (spinner) {
                    setSyncing(
                      true
                    );
                  }

                  try {
                    const data =
                      await fetchStock();

                    const update =
                      updateVelocity(
                        previousRef
                          .current,
                        data,
                        velocityRef
                          .current
                      );

                    previousRef.current =
                      update.previous;

                    velocityRef.current =
                      update.velocity;

                    if (
                      mountedRef.current
                    ) {
                      setRows(
                        data
                      );

                      setVelocity(
                        update.velocity
                      );

                      setError(
                        ''
                      );
                    }
                  } catch (err) {
                    if (
                      mountedRef.current
                    ) {
                      setError(
                        err?.message ||
                        String(err)
                      );
                    }
                  } finally {
                    if (
                      spinner &&
                      mountedRef.current
                    ) {
                      setSyncing(
                        false
                      );
                    }
                  }
                },
                []
              );

            const refreshPrices =
              useCallback(
                async key => {
                  const clean =
                    String(
                      key || ''
                    ).trim();

                  if (!clean) {
                    return;
                  }

                  setPriceSyncing(
                    true
                  );

                  try {
                    const result =
                      await fetchPrices(
                        clean
                      );

                    if (
                      mountedRef.current
                    ) {
                      setPrices(
                        result
                      );
                    }
                  } catch (err) {
                    if (
                      mountedRef.current
                    ) {
                      Alert.alert(
                        'Price sync',
                        err?.message ||
                        String(err)
                      );
                    }
                  } finally {
                    if (
                      mountedRef.current
                    ) {
                      setPriceSyncing(
                        false
                      );
                    }
                  }
                },
                []
              );

            useEffect(
              () => {
                mountedRef.current =
                  true;

                (
                  async () => {
                    try {
                      const savedSettings =
                        await SecureStore
                          .getItemAsync(
                            SETTINGS_STORAGE
                          );

                      const savedKey =
                        await SecureStore
                          .getItemAsync(
                            API_KEY_STORAGE
                          );

                      if (
                        savedSettings
                      ) {
                        setSettings({
                          ...DEFAULT_SETTINGS,
                          ...JSON.parse(
                            savedSettings
                          )
                        });
                      }

                      if (
                        savedKey
                      ) {
                        setApiKey(
                          savedKey
                        );

                        setApiInput(
                          savedKey
                        );
                      }

                      await refreshForeign(
                        true
                      );

                      if (
                        savedKey
                      ) {
                        refreshPrices(
                          savedKey
                        );
                      }
                    } catch (_) {
                      refreshForeign(
                        true
                      );
                    }
                  }
                )();

                return () => {
                  mountedRef.current =
                    false;
                };
              },
              [
                refreshForeign,
                refreshPrices
              ]
            );

            useEffect(
              () => {
                const timer =
                  setInterval(
                    () =>
                      setNow(
                        Date.now()
                      ),
                    5000
                  );

                return () =>
                  clearInterval(
                    timer
                  );
              },
              []
            );

            useEffect(
              () => {
                const seconds =
                  Math.max(
                    15,
                    number(
                      settings
                        .refreshSeconds,
                      15
                    )
                  );

                const timer =
                  setInterval(
                    () =>
                      refreshForeign(
                        false
                      ),
                    seconds *
                      1000
                  );

                return () =>
                  clearInterval(
                    timer
                  );
              },
              [
                settings
                  .refreshSeconds,
                refreshForeign
              ]
            );

            useEffect(
              () => {
                if (!apiKey) {
                  return;
                }

                const timer =
                  setInterval(
                    () =>
                      refreshPrices(
                        apiKey
                      ),
                    300000
                  );

                return () =>
                  clearInterval(
                    timer
                  );
              },
              [
                apiKey,
                refreshPrices
              ]
            );

            const groups =
              useMemo(
                () =>
                  buildGroups(
                    rows
                  ),
                [
                  rows
                ]
              );

            const capacityValue =
              getCapacity(
                settings
              );

            const candidates =
              useMemo(
                () =>
                  rows.map(
                    item =>
                      getCandidate(
                        item,
                        prices,
                        settings,
                        velocity
                      )
                  ),
                [
                  rows,
                  prices,
                  settings,
                  velocity
                ]
              );

            const best =
              useMemo(
                () =>
                  candidates
                    .filter(
                      item =>
                        item.quantity >
                          0 &&
                        item
                          .marketPrice >
                          0 &&
                        item
                          .profitEach >
                          0 &&
                        (
                          item
                            .projectedProfit ??
                          item
                            .loadProfit ??
                          0
                        ) > 0
                    )
                    .sort(
                      (
                        a,
                        b
                      ) =>
                        (
                          b.ppm ??
                          -Infinity
                        ) -
                        (
                          a.ppm ??
                          -Infinity
                        )
                    )[0] ||
                  null,
                [
                  candidates
                ]
              );

            const trips =
              useMemo(
                () => {
                  const result =
                    new Map();

                  const priceReady =
                    Object.keys(
                      prices
                    ).length >
                    0;

                  for (
                    const item
                    of candidates
                  ) {
                    if (
                      item.quantity <=
                      0
                    ) {
                      continue;
                    }

                    const old =
                      result.get(
                        item
                          .countryCode
                      );

                    const score =
                      priceReady
                        ? item.ppm ??
                          -Infinity
                        : item.quantity;

                    const oldScore =
                      old
                        ? priceReady
                          ? old.ppm ??
                            -Infinity
                          : old.quantity
                        : -Infinity;

                    if (
                      !old ||
                      score >
                        oldScore
                    ) {
                      result.set(
                        item
                          .countryCode,
                        item
                      );
                    }
                  }

                  return Array.from(
                    result.values()
                  ).sort(
                    (
                      a,
                      b
                    ) =>
                      priceReady
                        ? (
                            b.ppm ??
                            -Infinity
                          ) -
                          (
                            a.ppm ??
                            -Infinity
                          )
                        : b.quantity -
                          a.quantity
                  );
                },
                [
                  candidates,
                  prices
                ]
              );

            async function updateSettings(
              patch
            ) {
              const next = {
                ...settings,
                ...patch
              };

              setSettings(
                next
              );

              try {
                await SecureStore
                  .setItemAsync(
                    SETTINGS_STORAGE,
                    JSON.stringify(
                      next
                    )
                  );
              } catch (_) {}
            }

            async function saveKey() {
              Keyboard.dismiss();

              const clean =
                apiInput.trim();

              if (clean) {
                await SecureStore
                  .setItemAsync(
                    API_KEY_STORAGE,
                    clean
                  );
              } else {
                await SecureStore
                  .deleteItemAsync(
                    API_KEY_STORAGE
                  );
              }

              setApiKey(
                clean
              );

              if (!clean) {
                setPrices(
                  {}
                );

                return;
              }

              await refreshPrices(
                clean
              );
            }

            const priceReady =
              Object.keys(
                prices
              ).length > 0;

            return (
              <SafeAreaView
                style={
                  styles.safe
                }
              >
                <StatusBar
                  style="light"
                  backgroundColor={
                    C.bg
                  }
                />

                <Header
                  tab={
                    tab
                  }
                  syncing={
                    syncing
                  }
                  priceReady={
                    priceReady
                  }
                  onRefresh={
                    () => {
                      refreshForeign(
                        true
                      );

                      if (
                        apiKey
                      ) {
                        refreshPrices(
                          apiKey
                        );
                      }
                    }
                  }
                />

                <View
                  style={
                    styles.content
                  }
                >
                  {tab ===
                  'MARKET' ? (
                    <MarketScreen
                      groups={
                        groups
                      }
                      best={
                        best
                      }
                      capacityValue={
                        capacityValue
                      }
                      prices={
                        prices
                      }
                      settings={
                        settings
                      }
                      velocity={
                        velocity
                      }
                      now={
                        now
                      }
                      search={
                        search
                      }
                      setSearch={
                        setSearch
                      }
                      syncing={
                        syncing
                      }
                      error={
                        error
                      }
                      expandedCountries={
                        expandedCountries
                      }
                      setExpandedCountries={
                        setExpandedCountries
                      }
                      expandedItems={
                        expandedItems
                      }
                      setExpandedItems={
                        setExpandedItems
                      }
                    />
                  ) : null}

                  {tab ===
                  'TRIPS' ? (
                    <TripsScreen
                      trips={
                        trips
                      }
                      capacityValue={
                        capacityValue
                      }
                      priceReady={
                        priceReady
                      }
                    />
                  ) : null}

                  {tab ===
                  'SETTINGS' ? (
                    <SettingsScreen
                      settings={
                        settings
                      }
                      updateSettings={
                        updateSettings
                      }
                      apiInput={
                        apiInput
                      }
                      setApiInput={
                        setApiInput
                      }
                      apiKey={
                        apiKey
                      }
                      saveApiKey={
                        saveKey
                      }
                      priceSyncing={
                        priceSyncing
                      }
                    />
                  ) : null}
                </View>

                <BottomNav
                  tab={
                    tab
                  }
                  setTab={
                    setTab
                  }
                />
              </SafeAreaView>
            );
          }

