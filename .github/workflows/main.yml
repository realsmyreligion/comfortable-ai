                  }
                >
                  LIVE FEED
                </Text>

                <View
                  style={
                    styles.settingsCard
                  }
                >
                  <Choice
                    label="Refresh interval"
                    value={
                      settings
                        .refreshSeconds
                    }
                    onChange={
                      refreshSeconds =>
                        onSettings({
                          refreshSeconds
                        })
                    }
                    options={[
                      {
                        value: 15,
                        label:
                          '15 sec'
                      },
                      {
                        value: 30,
                        label:
