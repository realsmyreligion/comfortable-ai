name: Build TornPulse 2.0 RC14 Exact Icons

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/self-test.cjs

      - name: Recover verified RC12 sync and exact icons
        shell: bash
        run: |
          set -euo pipefail

          RC12_SHA="2f155d7f58e009803504b7f32db6caadc6b0f040"

          echo "Using verified RC12 commit:"
          echo "$RC12_SHA"

          git cat-file -e "$RC12_SHA:.github/workflows/main.yml"

          git show \
            "$RC12_SHA:.github/workflows/main.yml" \
            > /tmp/rc12.yml

          FIRST_LINE="$(head -n 1 /tmp/rc12.yml)"

          if [ "$FIRST_LINE" != "name: Build TornPulse 2.0 RC12 Verified Exact Icons" ]; then
            echo "Unexpected RC12 workflow header:"
            echo "$FIRST_LINE"
            exit 1
          fi

          python3 -m pip install --quiet pyyaml

          python3 <<'PY'
          from pathlib import Path
          import yaml

          path=Path('/tmp/rc12.yml')

          data=yaml.safe_load(
              path.read_text()
          )

          steps=data['jobs']['android']['steps']

          wanted={
              'Apply TornPulse synchronization fixes':
                  '/tmp/apply-sync.sh',

              'Install verified exact cooldown icons':
                  '/tmp/install-icons.sh',
          }

          recovered=[]

          for step in steps:
              name=str(
                  step.get('name','')
              ).strip()

              if name not in wanted:
                  continue

              run=step.get('run')

              if not run:
                  raise SystemExit(
                      name+
                      ': run block missing'
                  )

              Path(
                  wanted[name]
              ).write_text(
                  'set -euo pipefail\n'
                  +run+
                  '\n'
              )

              recovered.append(
                  name
              )

          missing=[
              name
              for name in wanted
              if name not in recovered
          ]

          if missing:
              raise SystemExit(
                  'Missing RC12 step(s): '+
                  ', '.join(missing)
              )

          print(
              '✓ RC12 synchronization patch recovered'
          )

          print(
              '✓ RC12 exact Drug / Booster / Medical icons recovered'
          )
          PY

          echo "Applying synchronization fixes..."
          bash /tmp/apply-sync.sh

          echo "Installing exact cooldown icons..."
          bash /tmp/install-icons.sh

          echo "✓ RC12 sync and exact icon payloads applied"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Run self-test
        run: |
          npm run selftest

      - name: Validate JavaScript bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path(
              'android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt'
          )

          if not p.exists():
              raise SystemExit(
                  'MainActivity.kt not found'
              )

          s=p.read_text()

          marker='TORNPULSE_IMMERSIVE_NAV_RC14'

          if marker not in s:

              package_pos=s.find(
                  'package '
              )

              e=s.find(
                  '\n',
                  package_pos
              )

              if package_pos<0 or e<0:
                  raise SystemExit(
                      'package declaration not found'
                  )

              imports='''import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          '''

              if 'import androidx.core.view.WindowCompat' not in s:
                  s=(
                      s[:e+1]
                      +imports
                      +s[e+1:]
                  )

              end=s.rfind(
                  '\n}'
              )

              if end<0:
                  raise SystemExit(
                      'MainActivity class ending not found'
                  )

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC14
            private fun applyTornPulseNav() {
              val controller =
                WindowCompat.getInsetsController(
                  window,
                  window.decorView
                )

              controller.hide(
                WindowInsetsCompat.Type.navigationBars()
              )

              controller.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(
              hasFocus: Boolean
            ) {
              super.onWindowFocusChanged(
                hasFocus
              )

              if (hasFocus) {
                applyTornPulseNav()
              }
            }
          '''

              s=(
                  s[:end]
                  +code
                  +s[end:]
              )

              if (
                  'window.decorView.post { applyTornPulseNav() }'
                  not in s
              ):
                  s=s.replace(
                      'super.onCreate(null)',
                      'super.onCreate(null)\n'
                      '    window.decorView.post { applyTornPulseNav() }',
                      1
                  )

              p.write_text(
                  s
              )

          print(
              '✓ immersive navigation patch applied'
          )
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK size:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc14-exact-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
