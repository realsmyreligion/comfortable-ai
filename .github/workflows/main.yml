name: Build TornPulse 2.0 RC13 Exact Icons

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/self-test.cjs

      - name: Recover verified RC12 icon and sync payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml

          FOUND=""
          for SHA in $(git log -n 50 --format=%H -- .github/workflows/main.yml); do
            if git show "$SHA:.github/workflows/main.yml" 2>/dev/null | grep -q "Build TornPulse 2.0 RC12 Verified Exact Icons"; then
              git show "$SHA:.github/workflows/main.yml" > /tmp/rc12.yml
              FOUND="$SHA"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "RC12 workflow not found in recent git history"
            exit 1
          fi

          echo "Using verified RC12 payloads from $FOUND"

          python3 <<'PY'
          from pathlib import Path
          import yaml

          data=yaml.safe_load(Path('/tmp/rc12.yml').read_text())
          steps=data['jobs']['android']['steps']

          wanted={
              'Apply TornPulse synchronization fixes':'/tmp/apply-sync.sh',
              'Install verified exact cooldown icons':'/tmp/install-icons.sh',
          }

          found=set()

          for step in steps:
              name=step.get('name')

              if name in wanted:
                  run=step.get('run')

                  if not run:
                      raise SystemExit(f'{name}: run block missing')

                  Path(wanted[name]).write_text(
                      'set -euo pipefail\n'+run+'\n'
                  )

                  found.add(name)

          missing=set(wanted)-found

          if missing:
              raise SystemExit(
                  'Missing RC12 step(s): '+
                  ', '.join(sorted(missing))
              )

          print('✓ recovered RC12 synchronization patch')
          print('✓ recovered exact Drug / Booster / Medical icon payloads')
          PY

          bash /tmp/apply-sync.sh
          bash /tmp/install-icons.sh

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path(
              'android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt'
          )

          s=p.read_text()

          if 'TORNPULSE_IMMERSIVE_NAV_RC13' not in s:
              e=s.find(
                  '\n',
                  s.find('package ')
              )

              if e<0:
                  raise SystemExit(
                      'package declaration not found'
                  )

              s=(
                  s[:e+1]
                  +'import androidx.core.view.WindowCompat\n'
                  +'import androidx.core.view.WindowInsetsCompat\n'
                  +'import androidx.core.view.WindowInsetsControllerCompat\n'
                  +s[e+1:]
              )

              end=s.rfind('\n}')

              if end<0:
                  raise SystemExit(
                      'MainActivity class ending not found'
                  )

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC13
            private fun applyTornPulseNav() {
              val c =
                WindowCompat.getInsetsController(
                  window,
                  window.decorView
                )

              c.hide(
                WindowInsetsCompat.Type.navigationBars()
              )

              c.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(
              hasFocus:Boolean
            ) {
              super.onWindowFocusChanged(
                hasFocus
              )

              if(hasFocus) {
                applyTornPulseNav()
              }
            }
          '''

              s=s[:end]+code+s[end:]

              s=s.replace(
                  'super.onCreate(null)',
                  'super.onCreate(null)\n    window.decorView.post { applyTornPulseNav() }',
                  1
              )

              p.write_text(s)

          print('✓ Android navigation bar patch applied')
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc13-exact-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
