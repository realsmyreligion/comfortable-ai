          };

          function number(
            value,
            fallback = 0
          ) {
            const result =
              Number(value);

            return Number.isFinite(
              result
            )
              ? result
              : fallback;
          }

          function money(value) {
            const amount =
              Math.round(
                number(value)
              );

            const sign =
              amount < 0
                ? '-'
                : '';

            return (
              sign +
              '$' +
              Math.abs(
                amount
              ).toLocaleString()
            );
          }

          function shortMoney(
            value
          ) {
            const amount =
              number(value);

            const abs =
              Math.abs(amount);

            const sign =
              amount < 0
                ? '-'
                : '';

            if (abs >= 1000000000) {
              return (
                sign +
                '$' +
                (
                  abs /
                  1000000000
                ).toFixed(1) +
                'b'
              );
            }

            if (abs >= 1000000) {
              return (
                sign +
                '$' +
                (
                  abs /
                  1000000
                ).toFixed(1) +
                'm'
              );
            }

            if (abs >= 1000) {
              return (
                sign +
                '$' +
                (
                  abs /
                  1000
                ).toFixed(1) +
                'k'
              );
            }

            return money(amount);
          }

          function ageSeconds(
            timestamp,
            now
          ) {
            if (!timestamp) {
              return Infinity;
            }

            return Math.max(
              0,
              Math.floor(
                now / 1000
              ) -
              timestamp
            );
          }

          function ageLabel(
            seconds
          ) {
            if (
              !Number.isFinite(
                seconds
              )
            ) {
              return 'unknown';
            }

            if (seconds < 10) {
              return 'now';
            }

            if (seconds < 60) {
              return (
                seconds +
                's'
              );
            }

            const minutes =
              Math.floor(
                seconds / 60
              );

            if (
              minutes < 60
            ) {
              return (
                minutes +
                'm'
              );
            }

            return (
              Math.floor(
                minutes / 60
              ) +
              'h'
            );
          }

          function freshness(
            timestamp,
            now
          ) {
            const age =
              ageSeconds(
                timestamp,
                now
              );

            if (age <= 60) {
              return {
                label: 'LIVE',
                color: C.green,
                age
              };
            }

            if (age <= 300) {
              return {
                label: 'RECENT',
                color: C.amber,
                age
              };
            }

            return {
              label: 'STALE',
              color: C.red,
              age
            };
          }

          function getCapacity(
            settings
          ) {
            const base =
              Math.max(
                1,
                Math.trunc(
                  number(
                    settings.baseCapacity,
                    22
                  )
                )
              );

            return settings
              .tourismMode
              ? base * 2
              : base;
          }

          function getFlightMinutes(
            code,
            settings
          ) {
            const country =
              COUNTRIES[code];

            if (!country) {
              return 0;
            }

            const table =
              settings.mailingBook
                ? country.book
                : country.times;

            return number(
              table[
                settings.flightMode
              ],
              table.standard
            );
          }

          async function fetchJson(
            url,
            timeout = 16000
          ) {
            const controller =
              new AbortController();

            const timer =
              setTimeout(
                () =>
                  controller.abort(),
                timeout
              );

            try {
              const response =
                await fetch(
                  url,
                  {
                    signal:
                      controller.signal,
                    headers: {
                      Accept:
                        'application/json'
                    }
                  }
                );

              if (
                !response.ok
              ) {
                throw new Error(
                  'Request failed (' +
                  response.status +
                  ')'
                );
              }

              const data =
                await response.json();

              if (
                data?.error
              ) {
                throw new Error(
                  data.error.error ||
                  data.error.message ||
                  'API error'
                );
              }

              return data;
            } catch (error) {
              if (
                error?.name ===
                'AbortError'
              ) {
                throw new Error(
                  'Request timed out'
                );
              }

              throw error;
            } finally {
              clearTimeout(
                timer
              );
            }
          }

          function normalizeStock(
            payload
          ) {
            const rows = [];

            const root =
              payload?.stocks;

            if (
              !root ||
              typeof root !==
                'object'
            ) {
              return rows;
            }

            for (
              const [
                countryCode,
                block
              ] of
              Object.entries(root)
            ) {
              const meta =
                COUNTRIES[
                  countryCode
                ];

              if (!meta) {
                continue;
              }

              const updated =
                number(
                  block?.update
                );

              const stocks =
                Array.isArray(
                  block?.stocks
                )
                  ? block.stocks
                  : [];

              for (
                const item
                of stocks
              ) {
                const id =
                  Number(
                    item?.id
                  );

                if (
                  !Number.isFinite(
                    id
                  )
                ) {
                  continue;
                }

                rows.push({
                  key:
                    countryCode +
                    ':' +
                    id,

                  countryCode,

                  country:
                    meta.name,

                  city:
                    meta.city,

                  flag:
                    meta.flag,

                  fare:
                    meta.fare,

                  id,

                  name:
                    String(
                      item?.name ||
                      'Item #' +
                        id
                    ),

                  quantity:
                    Math.max(
                      0,
                      Math.trunc(
                        number(
                          item
                            ?.quantity
                        )
                      )
                    ),

                  foreignPrice:
                    Math.max(
                      0,
                      number(
                        item?.cost
                      )
                    ),

                  updated
                });
              }
            }

            return rows;
          }

          async function fetchStock() {
            const data =
              await fetchJson(
                YATA_URL
              );

            const rows =
              normalizeStock(
                data
              );

            if (!rows.length) {
              throw new Error(
                'No usable foreign stock data returned.'
              );
            }

            return rows;
          }

          function extractItems(
            payload
          ) {
            if (
              Array.isArray(
                payload?.items
              )
            ) {
              return payload.items;
            }

            if (
              payload?.items &&
              typeof payload.items ===
                'object'
            ) {
              return Object.entries(
                payload.items
              ).map(
                ([
                  id,
                  item
                ]) => ({
                  id:
                    Number(
                      item?.id ||
                      id
                    ),

                  ...(item || {})
                })
              );
            }

            return [];
          }

          async function fetchPrices(
            apiKey
          ) {
            const key =
              String(
                apiKey || ''
              ).trim();

            if (!key) {
              return {};
            }

            const url =
              TORN_ITEMS_URL +
              '&key=' +
              encodeURIComponent(
                key
              );

            const payload =
              await fetchJson(
                url,
                20000
              );

            const result = {};

            for (
              const item
              of extractItems(
                payload
              )
            ) {
              const id =
                Number(
                  item?.id
                );

              if (
                !Number.isFinite(
                  id
                )
              ) {
                continue;
              }

              const price =
                number(
                  item?.value
                    ?.market_price ??
                  item
                    ?.market_price ??
                  item
                    ?.market_value
                );

              result[
                String(id)
              ] = {
                name:
                  item?.name ||
                  'Item #' +
                    id,

                price:
                  Math.max(
                    0,
                    price
                  )
              };
            }

            return result;
          }

          function buildGroups(
            rows
          ) {
            const map =
              new Map();

            for (
              const code
              of COUNTRY_ORDER
            ) {
              const meta =
                COUNTRIES[code];

              map.set(
                code,
                {
                  countryCode:
                    code,

                  name:
                    meta.name,

                  city:
                    meta.city,

                  flag:
                    meta.flag,

                  fare:
                    meta.fare,

                  updated: 0,

                  items: []
                }
              );
            }

            for (
              const row
              of rows
            ) {
              const group =
                map.get(
                  row.countryCode
                );

              if (!group) {
                continue;
              }

              group.updated =
                Math.max(
                  group.updated,
                  row.updated
                );

              group.items.push(
                row
              );
            }

            return Array.from(
              map.values()
            ).filter(
              group =>
                group.items.length >
                0
            );
          }

          function updateVelocity(
            previous,
            rows,
            velocity
          ) {
            const nextPrevious = {
              ...previous
            };

            const nextVelocity = {
              ...velocity
            };

            for (
              const row
              of rows
            ) {
              const before =
                previous[
                  row.key
                ];

              if (
                before &&
                row.updated >
                  before.updated
              ) {
                const minutes =
                  (
                    row.updated -
                    before.updated
                  ) /
                  60;

                if (
                  minutes > 0 &&
                  row.quantity <
                    before.quantity
                ) {
                  const observed =
                    (
                      before.quantity -
                      row.quantity
                    ) /
                    minutes;

                  const oldRate =
                    number(
                      nextVelocity[
                        row.key
                      ]?.rate
                    );

                  nextVelocity[
                    row.key
                  ] = {
                    rate:
                      oldRate > 0
                        ? (
                            oldRate +
                            observed
                          ) /
                          2
                        : observed
                  };
                }

                if (
                  row.quantity >
                  before.quantity
                ) {
                  nextVelocity[
                    row.key
                  ] = {
                    rate: 0
                  };
                }
              }

              nextPrevious[
                row.key
              ] = {
                quantity:
                  row.quantity,

                updated:
                  row.updated
              };
            }

            return {
              previous:
                nextPrevious,

              velocity:
                nextVelocity
            };
          }

          function getCandidate(
            row,
            prices,
            settings,
            velocity
          ) {
            const cap =
              getCapacity(
                settings
              );

            const marketPrice =
              number(
                prices[
                  String(
                    row.id
                  )
                ]?.price
              );

            const profitEach =
              marketPrice > 0
                ? marketPrice -
                  row.foreignPrice
                : 0;

            const minutes =
              getFlightMinutes(
                row.countryCode,
                settings
              );

            const rate =
              Math.max(
                0,
                number(
                  velocity[
                    row.key
                  ]?.rate
                )
              );

            const projectedQty =
              rate > 0
                ? Math.max(
                    0,
                    Math.floor(
                      row.quantity -
                      rate *
                        minutes
                    )
                  )
                : null;

            const currentLoad =
              Math.min(
                cap,
                row.quantity
              );

            const projectedLoad =
              projectedQty ===
              null
                ? currentLoad
                : Math.min(
                    cap,
                    projectedQty
                  );

            const fare =
              settings
                .flightMode ===
              'standard'
                ? row.fare * 2
                : 0;

            const loadProfit =
              marketPrice > 0
                ? currentLoad *
                    profitEach -
                  fare
                : null;

            const projectedProfit =
              marketPrice > 0
                ? projectedLoad *
                    profitEach -
                  fare
                : null;

            const ppm =
              projectedProfit !==
                null &&
              minutes > 0
                ? projectedProfit /
                  (
                    minutes * 2
                  )
                : null;

            let arrival =
              'NO TREND';

            if (
              row.quantity <= 0
            ) {
              arrival =
                'SOLD OUT';
            } else if (
              projectedQty ===
              null
            ) {
              arrival =
                'NO TREND';
            } else if (
              projectedQty >=
              cap
            ) {
              arrival =
                'LIKELY';
            } else if (
              projectedQty > 0
            ) {
              arrival =
                'AT RISK';
            } else {
              arrival =
                'UNLIKELY';
            }

            return {
              ...row,
              marketPrice,
              profitEach,
              minutes,
              projectedQty,
              projectedLoad,
              loadProfit,
              projectedProfit,
              ppm,
              arrival
            };
          }

