                        onSettings({
                          hideSoldOut:
                            !settings
                              .hideSoldOut
                        })
                    }
                  />
                </View>

                <View
                  style={
                    styles.infoCard
                  }
                >
                  <Text
                    style={
                      styles.eyebrow
                    }
                  >
                    DATA
                  </Text>

                  <Text
                    style={
