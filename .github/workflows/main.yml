                      }
                    ]}
                  />

                  <Toggle
                    label="Mailing Yourself Abroad"
                    detail="Use the reduced travel-time table."
                    value={
                      settings
                        .mailingBook
                    }
                    onPress={
                      () =>
                        onSettings({
                          mailingBook:
                            !settings
                              .mailingBook
                        })
                    }
                  />
                </View>

                <Text
                  style={
