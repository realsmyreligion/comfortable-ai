name: Build TornPulse 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TornPulse core self-test
        run: npm run selftest

      - name: Verify TornPulse 2.0 foundation
        run: npm run verify

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/tornpulse-bundle-check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify native TornPulse HUD
        run: |
          HUD=android/app/src/main/java/com/comfortableai/torncopilot/ComfortableOverlayService.kt
          grep -q 'TornPulse/' "$HUD"
          grep -q 'hud_preset' "$HUD"
          grep -q 'currentMinWidthDp = 118' "$HUD"
          grep -q 'currentCollapsedWidthDp = 44' "$HUD"
          grep -q 'approved_right_rail_v1' "$HUD"
          grep -q 'openBaldrList()' "$HUD"
          grep -q 'eventTickerText' "$HUD"

      - name: Make Gradle executable
       
