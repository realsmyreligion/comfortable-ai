          function BottomNav({
            tab,
            setTab
          }) {
            const items = [
              [
                'MARKET',
                '⌁'
              ],
              [
                'TRIPS',
                '✈'
              ],
              [
                'SETTINGS',
                '⚙'
              ]
            ];

            return (
              <View
                style={
                  styles.nav
                }
              >
                {items.map(
                  ([
                    key,
                    icon
                  ]) => (
                    <Pressable
                      key={
                        key
                      }
                      onPress={
                        () =>
                          setTab(
                            key
                          )
                      }
                      style={
                        styles.navItem
                      }
                    >
                      {tab ===
                      key ? (
                        <View
                          style={
                            styles.navLine
                          }
                        />
                      ) : null}

                      <Text
                        style={[
                          styles.navIcon,
                          tab ===
                            key && {
                            color:
                              C.cyan
                          }
                        ]}
                      >
                        {icon}
                      </Text>

                      <Text
                        style={[
                          styles.navLabel,
                          tab ===
                            key && {
                            color:
                              C.cyan
                          }
                        ]}
                      >
                        {key}
                      </Text>
                    </Pressable>
                  )
                )}
              </View>
            );
          }

          export default function App() {
            const [
              tab,
              setTab
            ] =
              useState(
                'MARKET'
              );

            const [
              rows,
              setRows
            ] =
              useState([]);

            const [
              prices,
              setPrices
            ] =
              useState({});

            const [
              settings,
              setSettings
            ] =
              useState(
                DEFAULT_SETTINGS
              );

            const [
              apiKey,
              setApiKey
            ] =
              useState('');

            const [
              apiInput,
              setApiInput
            ] =
              useState('');

            const [
              search,
              setSearch
            ] =
              useState('');

            const [
              syncing,
              setSyncing
            ] =
              useState(true);

            const [
              priceSyncing,
              setPriceSyncing
            ] =
              useState(false);

            const [
              error,
              setError
            ] =
              useState('');

            const [
              feedFetchedAt,
              setFeedFetchedAt
            ] =
              useState(0);

            const [
              priceFetchedAt,
              setPriceFetchedAt
            ] =
              useState(0);

            const [
              now,
              setNow
            ] =
              useState(
                Date.now()
              );

            const [
              velocity,
              setVelocity
            ] =
              useState({});

            const previousRef =
              useRef({});

            const velocityRef =
              useRef({});

            const mounted =
              useRef(true);

            const refreshForeign =
              useCallback(
                async (
                  spinner = true
                ) => {
                  if (spinner) {
                    setSyncing(
                      true
                    );
                  }

                  try {
                    const data =
                      await getForeignStock();

                    const learned =
                      updateVelocity(
                        previousRef
                          .current,
                        data,
                        velocityRef
                          .current
                      );

                    previousRef.current =
                      learned.previous;

                    velocityRef.current =
                      learned.velocity;

                    if (
                      mounted.current
                    ) {
                      setRows(
                        data
                      );

                      setVelocity(
                        learned.velocity
                      );

                      setFeedFetchedAt(
                        Date.now()
                      );

                      setError(
                        ''
                      );
                    }
                  } catch (e) {
                    if (
                      mounted.current
                    ) {
                      setError(
                        e?.message ||
                        String(e)
                      );
                    }
                  } finally {
                    if (
                      mounted.current &&
                      spinner
                    ) {
                      setSyncing(
                        false
                      );
                    }
                  }
                },
                []
              );

            const refreshPrices =
              useCallback(
                async key => {
                  const clean =
                    String(
                      key || ''
                    ).trim();

                  if (!clean) {
                    return;
                  }

                  setPriceSyncing(
                    true
                  );

                  try {
                    const map =
                      await getTornPrices(
                        clean
                      );

                    if (
                      mounted.current
                    ) {
                      setPrices(
                        map
                      );

                      setPriceFetchedAt(
                        Date.now()
                      );
                    }
                  } catch (e) {
                    if (
                      mounted.current
                    ) {
                      Alert.alert(
                        'Torn prices',
                        e?.message ||
                        String(e)
                      );
                    }
                  } finally {
                    if (
                      mounted.current
                    ) {
                      setPriceSyncing(
                        false
                      );
                    }
                  }
                },
                []
              );

            useEffect(
              () => {
                mounted.current =
                  true;

                (
                  async () => {
                    const [
                      savedSettings,
                      savedKey
                    ] =
                      await Promise.all(
                        [
                          loadStoredSettings(),
                          SecureStore
                            .getItemAsync(
                              KEY_API
                            )
                        ]
                      );

                    if (
                      !mounted.current
                    ) {
                      return;
                    }

                    setSettings(
                      savedSettings
                    );

                    setApiKey(
                      savedKey || ''
                    );

                    setApiInput(
                      savedKey || ''
                    );

                    await refreshForeign(
                      true
                    );

                    if (
                      savedKey
                    ) {
                      refreshPrices(
                        savedKey
                      );
                    }
                  }
                )();

                return () => {
                  mounted.current =
                    false;
                };
              },
              [
                refreshForeign,
                refreshPrices
              ]
            );

            useEffect(
              () => {
                const id =
                  setInterval(
                    () =>
                      setNow(
                        Date.now()
                      ),
                    5000
                  );

                return () =>
                  clearInterval(
                    id
                  );
              },
              []
            );

            useEffect(
              () => {
                const ms =
                  Math.max(
                    15,
                    n(
                      settings
                        .refreshSeconds,
                      15
                    )
                  ) *
                  1000;

                const id =
                  setInterval(
                    () =>
                      refreshForeign(
                        false
                      ),
                    ms
                  );

                return () =>
                  clearInterval(
                    id
                  );
              },
              [
                settings
                  .refreshSeconds,
                refreshForeign
              ]
            );

            useEffect(
              () => {
                if (!apiKey) {
                  return;
                }

                const id =
                  setInterval(
                    () =>
                      refreshPrices(
                        apiKey
                      ),
                    300000
                  );

                return () =>
                  clearInterval(
                    id
                  );
              },
              [
                apiKey,
                refreshPrices
              ]
            );

            const groups =
              useMemo(
                () =>
                  buildGroups(
                    rows
                  ),
                [
                  rows
                ]
              );

            const cap =
              capacity(
                settings
              );

            const candidates =
              useMemo(
                () =>
                  rows.map(
                    row =>
                      candidate(
                        row,
                        prices,
                        settings,
                        velocity
                      )
                  ),
                [
                  rows,
                  prices,
                  settings,
                  velocity
                ]
              );

            const best =
              useMemo(
                () =>
                  candidates
                    .filter(
                      x =>
                        x.quantity >
                          0 &&
                        x.marketPrice >
                          0 &&
                        x.profitEach >
                          0 &&
                        (
                          x.projectedProfit ??
                          x.loadProfit ??
                          0
                        ) > 0
                    )
                    .sort(
                      (
                        a,
                        b
                      ) =>
                        (
                          b.ppm ??
                          -Infinity
                        ) -
                        (
                          a.ppm ??
                          -Infinity
                        )
                    )[0] ||
                  null,
                [
                  candidates
                ]
              );

            const trips =
              useMemo(
                () => {
                  const map =
                    new Map();

                  const hasPrices =
                    Object.keys(
                      prices
                    ).length >
                    0;

                  for (
                    const c of
                    candidates
                  ) {
                    if (
                      c.quantity <=
                      0
                    ) {
                      continue;
                    }

                    const old =
                      map.get(
                        c.countryCode
                      );

                    const score =
                      hasPrices
                        ? c.ppm ??
                          -Infinity
                        : c.quantity;

                    const oldScore =
                      old
                        ? hasPrices
                          ? old.ppm ??
                            -Infinity
                          : old.quantity
                        : -Infinity;

                    if (
                      !old ||
                      score >
                        oldScore
                    ) {
                      map.set(
                        c.countryCode,
                        c
                      );
                    }
                  }

                  return Array.from(
                    map.values()
                  ).sort(
                    (
                      a,
                      b
                    ) =>
                      hasPrices
                        ? (
                            b.ppm ??
                            -Infinity
                          ) -
                          (
                            a.ppm ??
                            -Infinity
                          )
                        : b.quantity -
                          a.quantity
                  );
                },
                [
                  candidates,
                  prices
                ]
              );

            async function patchSettings(
              patch
            ) {
              const next = {
                ...settings,
                ...patch
              };

              setSettings(
                next
              );

              try {
                await saveStoredSettings(
                  next
                );
              } catch (_) {}
            }

            async function saveKey() {
              Keyboard.dismiss();

              const clean =
                apiInput
                  .trim();

              if (clean) {
                await SecureStore
                  .setItemAsync(
                    KEY_API,
                    clean
                  );
              } else {
                await SecureStore
                  .deleteItemAsync(
                    KEY_API
                  );
              }

              setApiKey(
                clean
              );

              if (!clean) {
                setPrices(
                  {}
                );

                setPriceFetchedAt(
                  0
                );

                return;
              }

              await refreshPrices(
                clean
              );
            }

            const feedAge =
              feedFetchedAt
                ? ageLabel(
                    Math.floor(
                      (
                        now -
                        feedFetchedAt
                      ) /
                      1000
                    )
                  )
                : '—';

            const priceAge =
              priceFetchedAt
                ? `Prices updated ${ageLabel(
                    Math.floor(
                      (
                        now -
                        priceFetchedAt
                      ) /
                      1000
                    )
                  )}`
                : 'No Torn price sync yet.';

            return (
              <SafeAreaView
                style={
                  styles.safe
                }
              >
                <StatusBar
                  style="light"
                  backgroundColor={
                    C.bg
                  }
                />

                <Header
                  tab={
                    tab
                  }
                  syncing={
                    syncing
                  }
                  pricesReady={
                    Object.keys(
                      prices
                    ).length > 0
                  }
                  onRefresh={
                    () => {
                      refreshForeign(
                        true
                      );

                      if (
                        apiKey
                      ) {
                        refreshPrices(
                          apiKey
                        );
                      }
                    }
                  }
                />

                <View
                  style={
                    styles.content
                  }
                >
                  {tab ===
                  'MARKET' ? (
                    <MarketScreen
                      groups={
                        groups
                      }
                      best={
                        best
                      }
                      cap={
                        cap
                      }
                      prices={
                        prices
                      }
                      settings={
                        settings
                      }
                      velocity={
                        velocity
                      }
                      now={
                        now
                      }
                      search={
                        search
                      }
                      setSearch={
                        setSearch
                      }
                      syncing={
                        syncing
                      }
                      feedAge={
                        feedAge
                      }
                      error={
                        error
                      }
                    />
                  ) : null}

                  {tab ===
                  'TRIPS' ? (
                    <TripsScreen
                      trips={
                        trips
                      }
                      cap={
                        cap
                      }
                      settings={
                        settings
                      }
                      pricesReady={
                        Object.keys(
                          prices
                        ).length >
                        0
                      }
                    />
                  ) : null}

                  {tab ===
                  'SETTINGS' ? (
                    <SettingsScreen
                      settings={
                        settings
                      }
                      onSettings={
                        patchSettings
                      }
                      apiInput={
                        apiInput
                      }
                      setApiInput={
                        setApiInput
                      }
                      apiKey={
                        apiKey
                      }
                      onSaveKey={
                        saveKey
                      }
                      priceAge={
                        priceAge
                      }
                      priceSyncing={
                        priceSyncing
                      }
                    />
                  ) : null}
                </View>

                <BottomNav
                  tab={
                    tab
                  }
                  setTab={
                    setTab
                  }
                />
              </SafeAreaView>
            );
          }

