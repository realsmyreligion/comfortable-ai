            }
          };

          const C = {
            bg: '#05080b',
            panel: '#0b1116',
            panel2: '#0e171d',
            line: '#1d2a33',
            text: '#f5f7f8',
            muted: '#8c9aa4',
            faint: '#53616b',
            cyan: '#30d5ff',
            green: '#51e39a',
            amber: '#ffc15c',
            red: '#ff6877',
            blue: '#7d92ff'
          };

          const DEFAULT_SETTINGS = {
            baseCapacity: 22,
            tourismMode: true,
            flightMode: 'standard',
            mailingBook: false,
            refreshSeconds: 15,
            hideSoldOut: false
          };

          const KEY_API =
            'tp_travel_api_v4';

          const KEY_SETTINGS =
            'tp_travel_settings_v4';

          function n(
            value,
            fallback = 0
          ) {
            const x = Number(value);

            return Number.isFinite(x)
              ? x
              : fallback;
          }

          function money(value) {
            const x =
              Math.round(
                n(value)
              );

            const sign =
              x < 0
                ? '-'
                : '';

            return (
              `${sign}$` +
              Math.abs(
                x
              ).toLocaleString()
            );
          }

          function compactMoney(value) {
            const x =
              n(value);

            const a =
              Math.abs(x);

            const sign =
              x < 0
                ? '-'
                : '';

            if (a >= 1e9) {
              return (
                `${sign}$` +
                (a / 1e9).toFixed(1) +
                'b'
              );
            }

            if (a >= 1e6) {
              return (
                `${sign}$` +
                (a / 1e6).toFixed(1) +
                'm'
              );
            }

            if (a >= 1e3) {
              return (
                `${sign}$` +
                (a / 1e3).toFixed(1) +
                'k'
              );
            }

            return money(x);
          }

          function ageSeconds(
            ts,
            now = Date.now()
          ) {
            if (!ts) {
              return Infinity;
            }

            return Math.max(
              0,
              Math.floor(
                now / 1000
              ) -
              Number(ts)
            );
          }

          function ageLabel(
            seconds
          ) {
            if (
              !Number.isFinite(
                seconds
              )
            ) {
              return 'unknown';
            }

            if (seconds < 10) {
              return 'just now';
            }

            if (seconds < 60) {
              return `${seconds}s ago`;
            }

            const m =
              Math.floor(
                seconds / 60
              );

            if (m < 60) {
              return `${m}m ago`;
            }

            return (
              `${Math.floor(
                m / 60
              )}h ago`
            );
          }

          function freshness(
            ts,
            now = Date.now()
          ) {
            const age =
              ageSeconds(
                ts,
                now
              );

            if (age <= 60) {
              return {
                label: 'LIVE',
                color: C.green,
                age
              };
            }

            if (age <= 300) {
              return {
                label: 'RECENT',
                color: C.amber,
                age
              };
            }

            return {
              label: 'STALE',
              color: C.red,
              age
            };
          }

          function flightMinutes(
            code,
            settings
          ) {
            const meta =
              COUNTRIES[code];

            if (!meta) {
              return 0;
            }

            const table =
              settings.mailingBook
                ? meta.book
                : meta.times;

            return n(
              table[
                settings.flightMode
              ],
              table.standard || 0
            );
          }

          function capacity(
            settings
          ) {
            const base =
              Math.max(
                1,
                Math.trunc(
                  n(
                    settings.baseCapacity,
                    22
                  )
                )
              );

            return settings.tourismMode
              ? base * 2
              : base;
          }

          function normalizeForeign(
            payload
          ) {
            const rows = [];

            const root =
              payload?.stocks;

            if (
              !root ||
              typeof root !== 'object'
            ) {
              return rows;
            }

            for (
              const [
                code,
                block
              ] of Object.entries(
                root
              )
            ) {
              const meta =
                COUNTRIES[code] ||
                {
                  name:
                    code.toUpperCase(),
                  city: '',
                  flag: '🌐',
                  fare: 0
                };

              const updated =
                n(
                  block?.update,
                  0
                );

              const stocks =
                Array.isArray(
                  block?.stocks
                )
                  ? block.stocks
                  : [];

              for (
                const item of stocks
              ) {
                const id =
                  n(
                    item?.id,
                    NaN
                  );

                if (
                  !Number.isFinite(id)
                ) {
                  continue;
                }

                rows.push({
                  key:
                    `${code}:${id}`,

                  countryCode:
                    code,

                  country:
                    meta.name,

                  city:
                    meta.city,

                  flag:
                    meta.flag,

                  fare:
                    meta.fare,

                  id,

                  name:
                    String(
                      item?.name ||
                      `Item #${id}`
                    ),

                  quantity:
                    Math.max(
                      0,
                      Math.trunc(
                        n(
                          item?.quantity,
                          0
                        )
                      )
                    ),

                  foreignPrice:
                    Math.max(
                      0,
                      n(
                        item?.cost,
                        0
                      )
                    ),

                  updated
                });
              }
            }

            return rows;
          }

          async function fetchJson(
            url,
            options = {},
            timeout = 16000
          ) {
            const controller =
              typeof AbortController !==
              'undefined'
                ? new AbortController()
                : null;

            const timer =
              controller
                ? setTimeout(
                    () =>
                      controller.abort(),
                    timeout
                  )
                : null;

            try {
              const response =
                await fetch(
                  url,
                  {
                    ...options,
                    signal:
                      controller?.signal
                  }
                );

              if (
                !response.ok
              ) {
                throw new Error(
                  `Request failed (${response.status})`
                );
              }

              const data =
                await response.json();

              if (
                data?.error
              ) {
                throw new Error(
                  data.error.error ||
                  data.error.message ||
                  'API error'
                );
              }

              return data;
            } catch (e) {
              if (
                String(
                  e?.name
                ) ===
                'AbortError'
              ) {
                throw new Error(
                  'Request timed out'
                );
              }

              throw e;
            } finally {
              if (timer) {
                clearTimeout(timer);
              }
            }
          }

          async function getForeignStock() {
            const payload =
              await fetchJson(
                YATA_URL,
                {
                  headers: {
                    Accept:
                      'application/json'
                  }
                }
              );

            const rows =
              normalizeForeign(
                payload
              );

            if (!rows.length) {
              throw new Error(
                'Foreign stock feed returned no usable data.'
              );
            }

            return rows;
          }

          function extractItems(
            payload
          ) {
            if (
              Array.isArray(
                payload?.items
              )
            ) {
              return payload.items;
            }

            if (
              payload?.items &&
              typeof payload.items ===
              'object'
            ) {
              return Object.entries(
                payload.items
              ).map(
                ([id, item]) => ({
                  id:
                    Number(
                      item?.id ||
                      id
                    ),

                  ...(item || {})
                })
              );
            }

            return Array.isArray(
              payload
            )
              ? payload
              : [];
          }

          async function getTornPrices(
            apiKey
          ) {
            const key =
              String(
                apiKey || ''
              ).trim();

            if (!key) {
              return {};
            }

            const payload =
              await fetchJson(
                `${TORN_ITEMS_URL}&key=${encodeURIComponent(key)}`,
                {
                  headers: {
                    Accept:
                      'application/json'
                  }
                },
                20000
              );

            const map = {};

            for (
              const item of
              extractItems(payload)
            ) {
              const id =
                Number(
                  item?.id
                );

              if (
                !Number.isFinite(id)
              ) {
                continue;
              }

              const value =
                item?.value || {};

              const price =
                n(
                  value.market_price ??
                  item.market_price ??
                  item.market_value,
                  0
                );

              map[
                String(id)
              ] = {
                name:
                  String(
                    item?.name ||
                    `Item #${id}`
                  ),

                price:
                  Math.max(
                    0,
                    price
                  )
              };
            }

            return map;
          }

          async function loadStoredSettings() {
            try {
              const raw =
                await SecureStore
                  .getItemAsync(
                    KEY_SETTINGS
                  );

              return raw
                ? {
                    ...DEFAULT_SETTINGS,
                    ...JSON.parse(raw)
                  }
                : DEFAULT_SETTINGS;
            } catch (_) {
              return DEFAULT_SETTINGS;
            }
          }

          async function saveStoredSettings(
            value
          ) {
            await SecureStore
              .setItemAsync(
                KEY_SETTINGS,
                JSON.stringify(
                  value
                )
              );
          }

          function buildGroups(
            rows
          ) {
            const map =
              new Map();

            for (
              const code of
              COUNTRY_ORDER
            ) {
              const meta =
                COUNTRIES[code];

              map.set(
                code,
                {
                  countryCode:
                    code,

                  ...meta,

                  updated: 0,
                  items: []
                }
              );
            }

            for (
              const row of rows
            ) {
              if (
                !map.has(
                  row.countryCode
                )
              ) {
                map.set(
                  row.countryCode,
                  {
                    countryCode:
                      row.countryCode,

                    name:
                      row.country,

                    city:
                      row.city,

                    flag:
                      row.flag,

                    fare:
                      row.fare,

                    updated: 0,
                    items: []
                  }
                );
              }

              const group =
                map.get(
                  row.countryCode
                );

              group.updated =
                Math.max(
                  group.updated || 0,
                  row.updated || 0
                );

              group.items.push(
                row
              );
            }

            return Array.from(
              map.values()
            )
              .filter(
                group =>
                  group.items.length
              )
              .map(
                group => ({
                  ...group,

                  items:
                    group.items
                      .slice()
                      .sort(
                        (a, b) =>
                          a.name.localeCompare(
                            b.name
                          )
                      )
                })
              );
          }

          function updateVelocity(
            previous,
            rows,
            oldVelocity
          ) {
            const nextPrev = {
              ...previous
            };

            const nextVel = {
              ...oldVelocity
            };

            for (
              const row of rows
            ) {
              const prev =
                previous[
                  row.key
                ];

              if (
                prev &&
                row.updated >
                prev.updated
              ) {
                const minutes =
                  (
                    row.updated -
                    prev.updated
                  ) / 60;

                if (
                  minutes > 0 &&
                  row.quantity <
                  prev.quantity
                ) {
                  const observed =
                    (
                      prev.quantity -
                      row.quantity
                    ) /
                    minutes;

                  const old =
                    n(
                      nextVel[
                        row.key
                      ]?.rate,
                      0
                    );

                  nextVel[
                    row.key
                  ] = {
                    rate:
                      old > 0
                        ? old * 0.5 +
                          observed * 0.5
                        : observed
                  };
                } else if (
                  minutes > 0 &&
                  row.quantity >
                  prev.quantity
                ) {
                  nextVel[
                    row.key
                  ] = {
                    rate: 0
                  };
                }
              }

              nextPrev[
                row.key
              ] = {
                quantity:
                  row.quantity,

                updated:
                  row.updated
              };
            }

            return {
              previous:
                nextPrev,

              velocity:
                nextVel
            };
          }

          function candidate(
            row,
            prices,
            settings,
            velocity
          ) {
            const cap =
              capacity(
                settings
              );

            const marketPrice =
              n(
                prices[
                  String(
                    row.id
                  )
                ]?.price,
                0
              );

            const profitEach =
              marketPrice > 0
                ? marketPrice -
                  row.foreignPrice
                : 0;

            const minutes =
              flightMinutes(
                row.countryCode,
                settings
              );

            const rate =
              Math.max(
                0,
                n(
                  velocity[
                    row.key
                  ]?.rate,
                  0
                )
              );

            const projectedQty =
              rate > 0
                ? Math.max(
                    0,
                    Math.floor(
                      row.quantity -
                      rate * minutes
                    )
                  )
                : null;

            const currentLoad =
              Math.min(
                cap,
                row.quantity
              );

            const projectedLoad =
              projectedQty == null
                ? currentLoad
                : Math.min(
                    cap,
                    projectedQty
                  );

            const fare =
              settings.flightMode ===
              'standard'
                ? n(
                    row.fare,
                    0
                  ) * 2
                : 0;

            const loadProfit =
              marketPrice > 0
                ? currentLoad *
                    profitEach -
                  fare
                : null;

            const projectedProfit =
              marketPrice > 0
                ? projectedLoad *
                    profitEach -
                  fare
                : null;

            const ppm =
              projectedProfit != null &&
              minutes > 0
                ? projectedProfit /
                  (
                    minutes * 2
                  )
                : null;

            let arrival =
              'NO TREND';

            if (
              row.quantity <= 0
            ) {
              arrival =
                'SOLD OUT';
            } else if (
              projectedQty ==
              null
            ) {
              arrival =
                'NO TREND';
            } else if (
              projectedQty >=
              cap
            ) {
              arrival =
                'LIKELY';
            } else if (
              projectedQty > 0
            ) {
              arrival =
                'AT RISK';
            } else {
              arrival =
                'UNLIKELY';
            }

            return {
              ...row,
              marketPrice,
              profitEach,
              minutes,
              rate,
              projectedQty,
              projectedLoad,
              loadProfit,
              projectedProfit,
              ppm,
              arrival
            };
          }

          function arrivalColor(
            value
          ) {
            if (
              value === 'LIKELY'
            ) {
              return C.green;
            }

            if (
              value ===
                'AT RISK' ||
              value ===
                'NO TREND'
            ) {
              return C.amber;
            }

            return C.red;
          }

          function Badge({
            text,
            color = C.muted
          }) {
            return (
              <View
                style={[
                  styles.badge,
                  {
                    borderColor:
                      color + '66'
                  }
                ]}
              >
                <Text
                  style={[
                    styles.badgeText,
                    { color }
                  ]}
                >
                  {text}
                </Text>
              </View>
            );
          }

          function Header({
            tab,
            syncing,
            pricesReady,
            onRefresh
          }) {
            return (
              <View
                style={
                  styles.header
                }
              >
                <View
                  style={
                    styles.headerRow
                  }
                >
                  <View>
                    <Text
                      style={
                        styles.logo
                      }
                    >
                      TORN{' '}
                      <Text
                        style={{
                          color:
                            C.cyan
                        }}
                      >
                        PULSE
                      </Text>
                    </Text>

                    <Text
                      style={
                        styles.subLogo
                      }
                    >
                      FOREIGN TRAVEL
                      MARKET • {tab}
                    </Text>
                  </View>

                  <Pressable
                    onPress={
                      onRefresh
                    }
                    disabled={
                      syncing
                    }
                    style={
                      styles.refreshButton
                    }
                  >
                    <Text
                      style={
                        styles.refreshText
                      }
                    >
                      {syncing
                        ? '•••'
                        : '↻'}
                    </Text>
                  </Pressable>
                </View>

                <View
                  style={
                    styles.badgeRow
                  }
                >
                  <Badge
                    text="FOREIGN STOCK"
                    color={
                      C.green
                    }
                  />

                  <Badge
                    text={
                      pricesReady
                        ? 'TORN PRICES ON'
                        : 'TORN PRICES OFF'
                    }
                    color={
                      pricesReady
                        ? C.cyan
                        : C.muted
                    }
                  />
                </View>
              </View>
            );
          }

          function BestCard({
            best,
            cap,
            pricesReady
          }) {
            if (!pricesReady) {
              return (
                <View
