name: Build Torn Pulse Travel Market 4.3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Replace project with Torn Pulse Travel Market 4.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android src scripts
          rm -f App.js package.json package-lock.json app.config.js

          cat > package.json <<'TP_PACKAGE_JSON'
          {
            "name": "tornpulse-travel-market",
            "version": "4.3.0",
            "private": true,
            "main": "expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android"
            },
            "dependencies": {
              "expo": "~57.0.0",
              "expo-secure-store": "*",
              "expo-status-bar": "*",
              "react": "19.2.3",
              "react-native": "0.86.0"
            }
          }
          TP_PACKAGE_JSON

          cat > app.config.js <<'TP_APP_CONFIG'
          module.exports = ({ config }) => ({
            ...config,
            name: 'Torn Pulse',
            slug: 'tornpulse-travel-market',
            version: '4.3.0',
            orientation: 'portrait',
            userInterfaceStyle: 'dark',
            android: {
              ...(config.android || {}),
              package: 'com.comfortableai.torncopilot',
              versionCode: 43
            },
            plugins: ['expo-secure-store'],
            extra: {
              product: 'Foreign Travel Market',
              build: 'Travel Market 4.3 Live Profit Engine'
            }
          });
          TP_APP_CONFIG

          cat > /tmp/tornpulse-app.gz.b64 <<'TP_APP_B64'
