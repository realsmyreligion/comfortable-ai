          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,json,re

          files={
              'TP_DRUG_ICON':'tp-drug.png',
              'TP_BOOSTER_ICON':'tp-booster.png',
              'TP_MEDICAL_ICON':'tp-medical.png',
          }

          # The approved artwork is palette PNG with alpha. Android AAPT2 can
          # choke on that palette/transparency combination. Re-save the exact
          # same pixels as ordinary 32-bit RGBA PNGs before Expo/Gradle sees them.
          for filename in files.values():
              path=Path(filename)
              with Image.open(path) as src:
                  rgba=src.convert('RGBA')
                  if rgba.size!=(128,128):
                      raise SystemExit(filename+f' is {rgba.size}, expected 128x128')
                  rgba.save(path,'PNG',compress_level=6,optimize=False)

              with Image.open(path) as check:
                  check.load()
                  if check.mode!='RGBA' or check.size!=(128,128):
                      raise SystemExit(filename+' did not normalize to RGBA')
                  alphas=check.getchannel('A').getextrema()
                  if alphas[0] != 0:
                      raise SystemExit(filename+' lost its transparent background')

              print(f'✓ {filename} normalized to Android-safe 128x128 RGBA PNG')

          cfgp=Path('app.config.js')
          cfg=cfgp.read_text()
          match=re.search(r'const OVERLAY_SERVICE_KT = ("(?:\\.|[^"\\])*");',cfg)
          if not match:raise SystemExit('OVERLAY_SERVICE_KT not found')

          service=json.loads(match.group(1))

          for constant,filename in files.items():
              encoded=base64.b64encode(Path(filename).read_bytes()).decode('ascii')
              pattern=re.compile(
                  r'(private val '+re.escape(constant)+r' = ")([A-Za-z0-9+/=]+)(")'
              )
              if not pattern.search(service):
                  raise SystemExit(constant+' not found in floating HUD')
              service=pattern.sub(
                  lambda m:m.group(1)+encoded+m.group(3),
                  service,
                  count=1
              )

          cfg=cfg[:match.start(1)]+json.dumps(service)+cfg[match.end(1):]
          cfgp.write_text(cfg)

          print('✅ Exact Drug / Booster / Medical RGBA icons installed in app + HUD')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Sanitize generated TornPulse Android PNG resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          wanted={'tpdrug.png','tpbooster.png','tpmedical.png'}
          found=[]

          for path in Path('android/app/src/main/res').rglob('*.png'):
              if path.name.lower() not in wanted:
                  continue

              with Image.open(path) as src:
                  rgba=src.convert('RGBA')
                  rgba.save(path,'PNG',compress_level=6,optimize=False)

              with Image.open(path) as check:
                  check.load()
                  if check.mode!='RGBA':
                      raise SystemExit(str(path)+' is not RGBA after sanitation')

              found.append(str(path))
              print('✓ sanitized '+str(path))

          if not found:
              raise SystemExit('No TornPulse cooldown Android PNG resources were generated')

          print('✅ Android resource PNGs are AAPT2-safe RGBA files')
          PY

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt')
          s=p.read_text()

          if 'TORNPULSE_IMMERSIVE_NAV_RC11' not in s:
              e=s.find('\n',s.find('package '))
              if e<0:raise SystemExit('package declaration not found')

              s=(
                  s[:e+1]
                  +'import androidx.core.view.WindowCompat\n'
                  +'import androidx.core.view.WindowInsetsCompat\n'
                  +'import androidx.core.view.WindowInsetsControllerCompat\n'
                  +s[e+1:]
              )

              end=s.rfind('\n}')
              if end<0:raise SystemExit('MainActivity class ending not found')

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC11
            private fun applyTornPulseNav() {
              val c=WindowCompat.getInsetsController(window,window.decorView)
              c.hide(WindowInsetsCompat.Type.navigationBars())
              c.systemBarsBehavior=
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(hasFocus:Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if(hasFocus) applyTornPulseNav()
            }
          '''

              s=s[:end]+code+s[end:]
              s=s.replace(
                  'super.onCreate(null)',
                  'super.onCreate(null)\n    window.decorView.post { applyTornPulseNav() }',
                  1
              )
              p.write_text(s)
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc11-android-safe-exact-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
