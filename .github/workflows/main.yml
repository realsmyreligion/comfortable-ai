                      },
                      {
                        value: 60,
                        label:
                          '60 sec'
                      }
                    ]}
                  />

                  <Toggle
                    label="Hide sold-out items"
                    detail="Only show items currently reported in stock."
                    value={
                      settings
                        .hideSoldOut
                    }
                    onPress={
