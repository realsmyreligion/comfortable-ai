      - name: Install clean Torn item icons
        shell: bash
        run: |
          echo "Installing Torn item artwork..."

          # Xanax
          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            "https://www.torn.com/images/items/206/large.png" \
            -o tp-drug.png

          # Feathery Hotel Coupon
          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            "https://www.torn.com/images/items/367/large.png" \
            -o tp-booster.png

          # O+ Blood Bag
          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            "https://www.torn.com/images/items/738/large.png" \
            -o tp-medical.png

          python3 <<'PY'
          from pathlib import Path

          for name in [
              "tp-drug.png",
              "tp-booster.png",
              "tp-medical.png",
          ]:
              data = Path(name).read_bytes()

              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(
                      f"ERROR: {name} is not a valid PNG"
                  )

              print(f"✓ {name}: {len(data):,} bytes")
          PY

          cat > /tmp/tornpulse-item-icons.cjs <<'TORNPULSE_ICONS'
          const fs = require('fs');

          const APP_FILE = 'App.js';
          const CONFIG_FILE = 'app.config.js';

          function extractEmbedded(src, name) {
            const prefix = `const ${name} = `;
            const start = src.indexOf(prefix);

            if (start < 0) {
              throw new Error(`Missing embedded ${name}`);
            }

            const valueStart = start + prefix.length;

            if (src[valueStart] !== '"') {
              throw new Error(`${name} is not a JSON string`);
            }

            let i = valueStart + 1;
            let escaped = false;

            for (; i < src.length; i++) {
              const ch = src[i];

              if (escaped) {
                escaped = false;
                continue;
              }

              if (ch === '\\') {
                escaped = true;
                continue;
              }

              if (ch === '"') break;
            }

            if (i >= src.length) {
              throw new Error(`Could not parse ${name}`);
            }

            return {
              start: valueStart,
              end: i + 1,
              value: JSON.parse(
                src.slice(valueStart, i + 1)
              )
            };
          }

          function setEmbedded(src, name, value) {
            const found = extractEmbedded(src, name);

            return (
              src.slice(0, found.start) +
              JSON.stringify(value) +
              src.slice(found.end)
            );
          }

          // ----------------------------------------
          // Main TornPulse dashboard
          // ----------------------------------------

          let app = fs.readFileSync(APP_FILE, 'utf8');

          const iconStyle =
            /v2CooldownIcon:\{width:\d+,height:\d+\}/;

          if (!iconStyle.test(app)) {
            throw new Error(
              'Could not locate v2CooldownIcon style'
            );
          }

          app = app.replace(
            iconStyle,
            'v2CooldownIcon:{width:48,height:48}'
          );

          fs.writeFileSync(
            APP_FILE,
            app,
            'utf8'
          );

          console.log(
            '✓ Dashboard item icons set to 48x48'
          );

          // ----------------------------------------
          // Native Android floating HUD
          // ----------------------------------------

          let config =
            fs.readFileSync(CONFIG_FILE, 'utf8');

          const embeddedKt =
            extractEmbedded(
              config,
              'OVERLAY_SERVICE_KT'
            );

          let kt = embeddedKt.value;

          const icons = [
            ['TP_DRUG_ICON', 'tp-drug.png'],
            ['TP_BOOSTER_ICON', 'tp-booster.png'],
            ['TP_MEDICAL_ICON', 'tp-medical.png']
          ];

          for (const [constant, file] of icons) {
            const encoded =
              fs.readFileSync(file)
                .toString('base64');

            const re = new RegExp(
              `((?:private\\s+)?val\\s+${constant}\\s*=\\s*")[^"]*(")`
            );

            if (!re.test(kt)) {
              throw new Error(
                `Could not locate ${constant}`
              );
            }

            kt = kt.replace(
              re,
              `$1${encoded}$2`
            );

            console.log(
              `✓ ${constant} refreshed`
            );
          }

          // Make Drug / Booster / Medical
          // easier to see in the floating HUD.
          kt = kt.replaceAll(
            'makeHudGlyph(label, labelColor, 11)',
            'makeHudGlyph(label, labelColor, 18)'
          );

          kt = kt.replaceAll(
            'makeHudGlyph(label, labelColor, 12)',
            'makeHudGlyph(label, labelColor, 18)'
          );

          config = setEmbedded(
            config,
            'OVERLAY_SERVICE_KT',
            kt
          );

          fs.writeFileSync(
            CONFIG_FILE,
            config,
            'utf8'
          );

          console.log(
            '✓ Native HUD Torn item icons refreshed'
          );

          console.log(
            '✅ TornPulse clean item icon upgrade complete'
          );
          TORNPULSE_ICONS

          node /tmp/tornpulse-item-icons.cjs

          grep -q \
            "v2CooldownIcon:{width:48,height:48}" \
            App.js

          echo "✓ TornPulse item icon verification passed"
