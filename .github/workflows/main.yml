name: Build TornPulse 2.0 RC16 Vitals + HUD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/self-test.cjs

      - name: Recover RC15 sync cooldowns and revamped vitals
        shell: bash
        run: |
          set -euo pipefail

          RC15_SHA="ce2b6370078d8ba113aaf12cfc791a8a9f67088d"

          echo "Using verified RC15 commit:"
          echo "$RC15_SHA"

          git cat-file -e "$RC15_SHA:.github/workflows/main.yml"
          git show "$RC15_SHA:.github/workflows/main.yml" > /tmp/rc15.yml

          python3 -m pip install --quiet pyyaml

          python3 <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('/tmp/rc15.yml').read_text())
          steps = data['jobs']['android']['steps']

          wanted = {
              'Recover verified RC12 sync and exact cooldown icons':
                  '/tmp/01-recover-rc12.sh',
              'Generate revamped vital icons':
                  '/tmp/02-generate-vitals.sh',
              'Verify revamped vital icons':
                  '/tmp/03-verify-vitals.sh',
          }

          found = set()

          for step in steps:
              name = str(step.get('name', '')).strip()

              if name not in wanted:
                  continue

              run = step.get('run')

              if not run:
                  raise SystemExit(
                      name + ': run block missing'
                  )

              Path(
                  wanted[name]
              ).write_text(
                  'set -euo pipefail\n'
                  + run
                  + '\n'
              )

              found.add(name)

          missing = [
              name
              for name in wanted
              if name not in found
          ]

          if missing:
              raise SystemExit(
                  'Missing RC15 step(s): '
                  + ', '.join(missing)
              )

          print(
              '✓ recovered RC15 synchronization + cooldown icon step'
          )

          print(
              '✓ recovered RC15 revamped vital generator'
          )

          print(
              '✓ recovered RC15 vital transparency verification'
          )
          PY

          bash /tmp/01-recover-rc12.sh
          bash /tmp/02-generate-vitals.sh
          bash /tmp/03-verify-vitals.sh

      - name: Inject revamped vital icons into floating HUD
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64
          import json

          cfg_path = Path(
              'app.config.js'
          )

          cfg = cfg_path.read_text()

          def embedded(src, name):
              prefix = (
                  'const '
                  + name
                  + ' = '
              )

              i = src.find(prefix)

              if i < 0:
                  return None

              start = i + len(prefix)

              if (
                  start >= len(src)
                  or src[start] != '"'
              ):
                  return None

              j = start + 1
              escaped = False

              while j < len(src):
                  c = src[j]

                  if escaped:
                      escaped = False

                  elif c == '\\':
                      escaped = True

                  elif c == '"':
                      break

                  j += 1

              if j >= len(src):
                  return None

              return (
                  start,
                  j + 1,
                  json.loads(
                      src[start:j+1]
                  )
              )

          def set_embedded(
              src,
              name,
              value
          ):
              found = embedded(
                  src,
                  name
              )

              if not found:
                  raise SystemExit(
                      name
                      + ' not found in app.config.js'
                  )

              start, end, _ = found

              return (
                  src[:start]
                  + json.dumps(value)
                  + src[end:]
              )

          found = embedded(
              cfg,
              'OVERLAY_SERVICE_KT'
          )

          if not found:
              raise SystemExit(
                  'OVERLAY_SERVICE_KT not found'
              )

          service = found[2]

          icons = {
              'TP_HEALTH_ICON':
                  'tp-health.png',

              'TP_ENERGY_ICON':
                  'tp-energy.png',

              'TP_NERVE_ICON':
                  'tp-nerve.png',

              'TP_HAPPINESS_ICON':
                  'tp-happiness.png',
          }

          for constant, filename in icons.items():

              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      filename + ' not found'
                  )

              encoded = base64.b64encode(
                  path.read_bytes()
              ).decode(
                  'ascii'
              )

              needle = (
                  'private val '
                  + constant
                  + ' = "'
              )

              i = service.find(
                  needle
              )

              if i < 0:
                  raise SystemExit(
                      constant
                      + ' not found in native HUD service'
                  )

              start = (
                  i
                  + len(needle)
              )

              end = service.find(
                  '"',
                  start
              )

              if end < 0:
                  raise SystemExit(
                      constant
                      + ' closing quote not found'
                  )

              service = (
                  service[:start]
                  + encoded
                  + service[end:]
              )

              if not encoded.startswith(
                  'iVBOR'
              ):
                  raise SystemExit(
                      constant
                      + ' did not encode as PNG'
                  )

              print(
                  '✓ HUD replaced '
                  + constant
                  + ' with '
                  + filename
              )

          cfg = set_embedded(
              cfg,
              'OVERLAY_SERVICE_KT',
              service
          )

          cfg_path.write_text(
              cfg
          )

          check = embedded(
              cfg,
              'OVERLAY_SERVICE_KT'
          )

          if not check:
              raise SystemExit(
                  'HUD service verification failed'
              )

          updated = check[2]

          for constant in icons:
              needle = (
                  'private val '
                  + constant
                  + ' = "iVBOR'
              )

              if needle not in updated:
                  raise SystemExit(
                      constant
                      + ' is not using the new PNG'
                  )

          print(
              '✅ Health / Energy / Nerve / Happiness updated in floating HUD'
          )

          print(
              '✅ Transparent PNG artwork now matches the main TornPulse screen'
          )
          PY

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Run self-test
        run: |
          npm run selftest

      - name: Validate JavaScript bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              'android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt'
          )

          if not p.exists():
              raise SystemExit(
                  'MainActivity.kt not found'
              )

          s = p.read_text()

          marker = (
              'TORNPULSE_IMMERSIVE_NAV_RC16'
          )

          if marker not in s:

              package_pos = s.find(
                  'package '
              )

              end_package = s.find(
                  '\n',
                  package_pos
              )

              if (
                  package_pos < 0
                  or end_package < 0
              ):
                  raise SystemExit(
                      'package declaration not found'
                  )

              imports = '''import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          '''

              if (
                  'import androidx.core.view.WindowCompat'
                  not in s
              ):
                  s = (
                      s[:end_package+1]
                      + imports
                      + s[end_package+1:]
                  )

              end_class = s.rfind(
                  '\n}'
              )

              if end_class < 0:
                  raise SystemExit(
                      'MainActivity class ending not found'
                  )

              code = '''
            // TORNPULSE_IMMERSIVE_NAV_RC16
            private fun applyTornPulseNav() {
              val controller =
                WindowCompat.getInsetsController(
                  window,
                  window.decorView
                )

              controller.hide(
                WindowInsetsCompat.Type.navigationBars()
              )

              controller.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(
              hasFocus: Boolean
            ) {
              super.onWindowFocusChanged(
                hasFocus
              )

              if (hasFocus) {
                applyTornPulseNav()
              }
            }
          '''

              s = (
                  s[:end_class]
                  + code
                  + s[end_class:]
              )

              if (
                  'window.decorView.post { applyTornPulseNav() }'
                  not in s
              ):
                  s = s.replace(
                      'super.onCreate(null)',
                      'super.onCreate(null)\n'
                      '    window.decorView.post { applyTornPulseNav() }',
                      1
                  )

              p.write_text(s)

          print(
              '✓ immersive navigation patch applied'
          )
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc16-vitals-hud-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
