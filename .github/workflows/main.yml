name: Build Torn Pulse Travel Market

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Replace project with Torn Pulse Travel Market
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android src scripts
          rm -f App.js package.json package-lock.json app.config.js

          cat > package.json <<'PACKAGE_JSON'
          {
            "name": "tornpulse-travel-market",
            "version": "4.0.0",
            "private": true,
            "main": "expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android",
              "export:android": "expo export --platform android",
              "prebuild:android": "expo prebuild --platform android --clean"
            },
            "dependencies": {
              "expo": "~57.0.0",
              "expo-secure-store": "*",
              "expo-status-bar": "*",
              "react": "19.2.3",
              "react-native": "0.86.0"
            }
          }
          PACKAGE_JSON

          cat > app.config.js <<'APP_CONFIG'
          module.exports = ({ config }) => ({
            ...config,
            name: 'Torn Pulse',
            slug: 'tornpulse-travel-market',
            version: '4.0.0',
            orientation: 'portrait',
            userInterfaceStyle: 'dark',
            android: {
              ...(config.android || {}),
              package: 'com.comfortableai.torncopilot',
              versionCode: 40
            },
            plugins: ['expo-secure-store'],
            extra: {
              product: 'Foreign Travel Market',
              build: 'Travel Market 4.0'
            }
          });
          APP_CONFIG

          cat > App.js <<'APP_JS'
          import React, {
            useCallback,
            useEffect,
            useMemo,
            useRef,
            useState
          } from 'react';

          import {
            ActivityIndicator,
            Alert,
            FlatList,
            Keyboard,
            Pressable,
            SafeAreaView,
            ScrollView,
            StyleSheet,
            Text,
            TextInput,
            View
          } from 'react-native';

          import { StatusBar } from 'expo-status-bar';
          import * as SecureStore from 'expo-secure-store';

          const YATA_URL =
            'https://yata.yt/api/v1/travel/export/';

          const TORN_ITEMS_URL =
            'https://api.torn.com/v2/torn/items?cat=All&sort=ASC&comment=TornPulseTravel';

          const COUNTRY_ORDER = [
