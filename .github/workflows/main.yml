name: Build TornPulse 2.0 RC7

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore source folders
        run: |
          mkdir -p src scripts
          cp core.js demo.js notifications.js storage.js tornApi.js src/
          cp self-test.cjs scripts/self-test.cjs

      - name: Apply alert sync and UI fixes
        shell: bash
        run: |
          cat > notifications.js <<'EOF'
          import {Platform} from 'react-native';
          import * as Notifications from 'expo-notifications';

          const CHANNEL='torn-alerts';
          const SOURCE='tornpulse';
          const OUR=new Set(['tornpulse','comfortable-ai']);
          const LEAD=6000;

          Notifications.setNotificationHandler({handleNotification:async()=>({shouldPlaySound:true,shouldSetBadge:false,shouldShowBanner:true,shouldShowList:true})});

          export async function prepareNotifications(){
            if(Platform.OS==='android') await Notifications.setNotificationChannelAsync(CHANNEL,{name:'Torn Alerts',importance:Notifications.AndroidImportance.MAX,sound:'default',vibrationPattern:[0,300,150,300]});
            let p=await Notifications.getPermissionsAsync();
            if(!p.granted) p=await Notifications.requestPermissionsAsync();
            return !!p.granted;
          }

          export async function getNotificationPermission(){
            return !!(await Notifications.getPermissionsAsync()).granted;
          }

          export async function clearTornPulseAlerts(){
            const all=await Notifications.getAllScheduledNotificationsAsync();
            await Promise.all(
              all
                .filter(x=>OUR.has(x.content.data?.source))
                .map(x=>Notifications.cancelScheduledNotificationAsync(x.identifier))
            );
          }

          const unix=s=>Number(s||0)>0?new Date(Number(s)*1000):null;

          const future=d=>
            d instanceof Date &&
            Number.isFinite(d.getTime()) &&
            d.getTime()>Date.now()+LEAD;

          const fromSecs=(snap,s)=>
            new Date(
              Number(snap?.fetchedAt||Date.now())+
              Math.max(0,Number(s||0))*1000
            );

          function warn(target,min){
            if(!target)return null;

            const d=new Date(
              target.getTime()-
              Math.max(0,Number(min||0))*60000
            );

            if(future(d))return d;

            if(target.getTime()>Date.now()+15000)
              return new Date(Date.now()+7000);

            return null;
          }

          async function add(
            title,
            body,
            date,
            kind,
            snap,
            key=''
          ){
            if(!future(date))return;

            await Notifications.scheduleNotificationAsync({
              content:{
                title,
                body,
                sound:'default',
                data:{
                  source:SOURCE,
                  kind,
                  profileId:String(snap?.profile?.id||''),
                  eventKey:String(key)
                }
              },
              trigger:{
                type:Notifications.SchedulableTriggerInputTypes.DATE,
                date,
                channelId:CHANNEL
              }
            });
          }

          function arrival(snap){
            const t=snap?.travel;

            if(!t)return 0;

            const a=Number(
              t.arrival||
              t.arrival_at||
              0
            );

            if(a>0)return a;

            const left=Number(t.time_left||0);

            return left>0
              ?Math.floor(Number(snap?.fetchedAt||Date.now())/1000)+left
              :0;
          }

          export async function scheduleSnapshotAlerts(
            snap,
            settings={}
          ){
            await clearTornPulseAlerts();

            if(!snap||snap.demo)return;

            for(const [name,label] of [
              ['energy','Energy'],
              ['nerve','Nerve']
            ]){
              const b=snap[name];
              const max=Number(b?.maximum||0);
              const cur=Number(b?.current||0);
              const full=unix(b?.full_time);

              if(full&&cur<max){
                const m=
                  settings[name+'WarningMinutes']??
                  15;

                const w=warn(full,m);

                if(w)
                  await add(
                    label+' warning',
                    label+' reaches cap in '+m+' minutes.',
                    w,
                    name+'-warning',
                    snap,
                    b.full_time
                  );

                await add(
                  label+' full',
                  'Your '+label+' is full.',
                  full,
                  name+'-full',
                  snap,
                  b.full_time
                );
              }
            }

            if(settings.cooldownAlerts!==false){
              for(const [k,t,b] of [
                [
                  'drug',
                  'Drug ready',
                  'Your drug cooldown is clear.'
                ],
                [
                  'booster',
                  'Booster ready',
                  'Your booster cooldown is clear.'
                ],
                [
                  'medical',
                  'Medical ready',
                  'Your medical cooldown is clear.'
                ]
              ]){
                const s=Number(
                  snap.cooldowns?.[k]||
                  0
                );

                if(s>5)
                  await add(
                    t,
                    b,
                    fromSecs(snap,s),
                    k,
                    snap,
                    String(snap.fetchedAt)+':'+s
                  );
              }
            }

            if(settings.statusAlerts!==false){
              const st=String(
                snap.status?.state||
                ''
              ).toLowerCase();

              const u=Number(
                snap.status?.until||
                0
              );

              if(
                u>0 &&
                (
                  st.includes('hospital')||
                  st.includes('jail')
                )
              ){
                const l=
                  st.includes('hospital')
                    ?'Hospital'
                    :'Jail';

                await add(
                  l+' release',
                  'Your '+l.toLowerCase()+' timer has ended.',
                  unix(u),
                  'status-release',
                  snap,
                  l+':'+u
                );
              }
            }

            const a=arrival(snap);
            const now=Math.floor(Date.now()/1000);
            const t=snap.travel;

            if(
              t &&
              a>now &&
              (
                t.active===true ||
                Number(t.time_left||0)>0
              )
            ){
              const dest=String(
                t.destination||
                'your destination'
              );

              const w=warn(
                unix(a),
                5
              );

              if(w)
                await add(
                  'Landing soon',
                  'You are expected to land in '+dest+' in about 5 minutes.',
                  w,
                  'travel-5m',
                  snap,
                  String(
                    t.departed||
                    t.departed_at||
                    0
                  )+
                  ':'+
                  a+
                  ':'+
                  dest
                );
            }
          }
          EOF

          cp notifications.js src/notifications.js

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          app=Path('App.js').read_text()

          app=app.replace(
              "import {getNotificationPermission, prepareNotifications, scheduleSnapshotAlerts} from './src/notifications';",
              "import {clearTornPulseAlerts, getNotificationPermission, prepareNotifications, scheduleSnapshotAlerts} from './src/notifications';"
          )

          app=app.replace(
              "setInterval(()=>sync(null,false).catch(()=>{}),120000)",
              "setInterval(()=>sync(null,false).catch(()=>{}),60000)"
          )

          app=app.replace(
              "async function disconnect() { await stopHud().catch(()=>{}); await clearApiKey();",
              "async function disconnect() { await stopHud().catch(()=>{}); await clearTornPulseAlerts().catch(()=>{}); await clearApiKey();"
          )

          # Keep the Start HUD button above Vitals.
          if '      <Text style={styles.v2SectionTitle}>Vitals</Text>' in app:
              m=re.search(
                  r'\n\s*<Pressable accessibilityRole="button" onPress=\{hudRunning\?stopHud:startHud\}[\s\S]*?</Pressable>\n(?=\s*<Text style=\{styles\.v2Sync\}>)',
                  app
              )

              if m:
                  button=m.group(0).strip('\n')+'\n'

                  app=(
                      app[:m.start()]
                      +'\n'
                      +app[m.end():]
                  )

                  app=app.replace(
                      '      <Text style={styles.v2SectionTitle}>Vitals</Text>',
                      button+
                      '      <Text style={styles.v2SectionTitle}>Vitals</Text>',
                      1
                  )

          pairs={
              "v2PageScroll:{paddingHorizontal:16,paddingTop:Platform.OS==='android'?18:4,paddingBottom:48}":
              "v2PageScroll:{paddingHorizontal:16,paddingTop:Platform.OS==='android'?12:4,paddingBottom:42}",

              "v2Card:{backgroundColor:C.surface,borderWidth:1,borderColor:C.line,borderRadius:16,padding:14,marginBottom:12}":
              "v2Card:{backgroundColor:C.surface,borderWidth:1,borderColor:C.line,borderRadius:15,padding:12,marginBottom:10}",

              "v2Vital:{width:'50%',padding:10}":
              "v2Vital:{width:'50%',padding:8}",

              "v2CooldownIcon:{width:36,height:36}":
              "v2CooldownIcon:{width:32,height:32}",

              "v2HudButton:{minHeight:76,borderRadius:16,backgroundColor:C.primary,flexDirection:'row',alignItems:'center',paddingHorizontal:16,gap:12,marginBottom:12}":
              "v2HudButton:{minHeight:64,borderRadius:15,backgroundColor:C.primary,flexDirection:'row',alignItems:'center',paddingHorizontal:14,gap:11,marginBottom:10}",

              "v2HudButtonIcon:{width:44,height:44,borderRadius:22,borderWidth:2,borderColor:'#DFF5FF',alignItems:'center',justifyContent:'center'}":
              "v2HudButtonIcon:{width:38,height:38,borderRadius:19,borderWidth:2,borderColor:'#DFF5FF',alignItems:'center',justifyContent:'center'}"
          }

          for a,b in pairs.items():
              app=app.replace(a,b)

          Path('App.js').write_text(app)

          cfg=Path('app.config.js').read_text()

          cfg=cfg.replace(
              "    ensurePermission(manifest, 'android.permission.POST_NOTIFICATIONS');",
              "    ensurePermission(manifest, 'android.permission.POST_NOTIFICATIONS');\n    ensurePermission(manifest, 'android.permission.SCHEDULE_EXACT_ALARM');"
          )

          def embedded(src,name):
              p='const '+name+' = '
              i=src.find(p)

              if i<0:
                  return None

              s=i+len(p)
              j=s+1
              esc=False

              while j<len(src):
                  c=src[j]

                  if esc:
                      esc=False
                  elif c=='\\':
                      esc=True
                  elif c=='"':
                      break

                  j+=1

              return (
                  s,
                  j+1,
                  json.loads(
                      src[s:j+1]
                  )
              )

          def setemb(src,name,val):
              x=embedded(
                  src,
                  name
              )

              if not x:
                  raise SystemExit(
                      name+
                      ' not found'
                  )

              s,e,_=x

              return (
                  src[:s]
                  +json.dumps(val)
                  +src[e:]
              )

          x=embedded(
              cfg,
              'OVERLAY_MODULE_KT'
          )

          if not x:
              raise SystemExit(
                  'OVERLAY_MODULE_KT not found'
              )

          kt=x[2]

          if 'fun canScheduleExactAlarms' not in kt:
              anchor=(
                  '  @ReactMethod\n'
                  '  fun startHud(apiKey: String, promise: Promise) {'
              )

              methods='''  @ReactMethod
          fun canScheduleExactAlarms(promise: Promise) {
            if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
              promise.resolve(true)
              return
            }

            try {
              val a =
                appContext.getSystemService(Context.ALARM_SERVICE)
                as android.app.AlarmManager

              promise.resolve(
                a.canScheduleExactAlarms()
              )
            } catch (_: Exception) {
              promise.resolve(false)
            }
          }

          @ReactMethod
          fun requestExactAlarmPermission(promise: Promise) {
            if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
              promise.resolve(true)
              return
            }

            try {
              val a =
                appContext.getSystemService(Context.ALARM_SERVICE)
                as android.app.AlarmManager

              if (a.canScheduleExactAlarms()) {
                promise.resolve(true)
                return
              }

              val i = Intent(
                Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
                Uri.parse(
                  "package:${appContext.packageName}"
                )
              ).apply {
                addFlags(
                  Intent.FLAG_ACTIVITY_NEW_TASK
                )
              }

              appContext.startActivity(i)
              promise.resolve(false)
            } catch (e: Exception) {
              promise.reject(
                "EXACT_ALARM_SETTINGS",
                "Unable to open precise alarm settings.",
                e
              )
            }
          }

          '''+anchor

              if anchor not in kt:
                  raise SystemExit(
                      'startHud anchor not found'
                  )

              kt=kt.replace(
                  anchor,
                  methods,
                  1
              )

              cfg=setemb(
                  cfg,
                  'OVERLAY_MODULE_KT',
                  kt
              )

          Path(
              'app.config.js'
          ).write_text(cfg)

          print(
              '✓ alert sync + UI patch applied'
          )
          PY

      - name: Rebuild Torn cooldown symbols
        shell: bash
        run: |
          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import base64
          import json
          import math
          import re

          S=128

          def canvas():
              return Image.new(
                  'RGBA',
                  (S,S),
                  (0,0,0,0)
              )

          def leaflet(
              d,
              cx,
              cy,
              a,
              L,
              w,
              color
          ):
              a=math.radians(a)

              dx=math.sin(a)
              dy=-math.cos(a)

              px=-dy
              py=dx

              mx=cx+dx*L*.52
              my=cy+dy*L*.52

              d.polygon(
                  [
                      (cx,cy),
                      (
                          cx+px*w,
                          cy+py*w
                      ),
                      (
                          mx+px*w*.6,
                          my+py*w*.6
                      ),
                      (
                          cx+dx*L,
                          cy+dy*L
                      ),
                      (
                          mx-px*w*.6,
                          my-py*w*.6
                      ),
                      (
                          cx-px*w,
                          cy-py*w
                      )
                  ],
                  fill=color
              )

          def drug():
              im=canvas()
              d=ImageDraw.Draw(im)

              c=(
                  196,
                  110,
                  255,
                  255
              )

              s=(
                  222,
                  180,
                  255,
                  255
              )

              d.line(
                  (64,96,64,61),
                  fill=s,
                  width=6
              )

              for a,L,w,o in [
                  (0,39,8,0),
                  (-24,35,7,-3),
                  (-47,29,6,-5),
                  (-72,23,5,-6),
                  (24,35,7,3),
                  (47,29,6,5),
                  (72,23,5,6)
              ]:
                  leaflet(
                      d,
                      64+o,
                      79+abs(o),
                      a,
                      L,
                      w,
                      c
                  )

              return im

          def booster():
              im=canvas()
              d=ImageDraw.Draw(im)

              o=(
                  130,
                  226,
                  255,
                  255
              )

              a=(
                  180,
                  245,
                  255,
                  255
              )

              f=(
                  40,
                  92,
                  130,
                  90
              )

              d.rounded_rectangle(
                  (39,35,89,104),
                  12,
                  fill=f,
                  outline=o,
                  width=5
              )

              d.rounded_rectangle(
                  (50,24,78,41),
                  6,
                  fill=f,
                  outline=o,
                  width=5
              )

              d.rounded_rectangle(
                  (47,18,81,28),
                  5,
                  fill=(
                      70,
                      120,
                      145,
                      130
                  ),
                  outline=a,
                  width=4
              )

              d.rounded_rectangle(
                  (46,51,82,83),
                  8,
                  fill=(
                      10,
                      24,
                      36,
                      120
                  ),
                  outline=a,
                  width=3
              )

              d.polygon(
                  [
                      (63,54),
                      (56,68),
                      (63,68),
                      (59,81),
                      (72,63),
                      (65,63),
                      (69,54)
                  ],
                  fill=a
              )

              return im

          def medical():
              im=canvas()
              d=ImageDraw.Draw(im)

              o=(
                  255,
                  120,
                  120,
                  255
              )

              a=(
                  255,
                  215,
                  215,
                  255
              )

              f=(
                  110,
                  35,
                  45,
                  90
              )

              d.rounded_rectangle(
                  (28,54,82,76),
                  8,
                  fill=f,
                  outline=o,
                  width=5
              )

              d.line(
                  (82,65,106,65),
                  fill=a,
                  width=4
              )

              d.line(
                  (106,65,116,62),
                  fill=a,
                  width=2
              )

              d.line(
                  (106,65,116,68),
                  fill=a,
                  width=2
              )

              d.rectangle(
                  (18,58,28,72),
                  outline=o,
                  width=4
              )

              d.line(
                  (12,65,18,65),
                  fill=o,
                  width=4
              )

              d.line(
                  (8,60,8,70),
                  fill=o,
                  width=4
              )

              for x in (
                  45,
                  56,
                  67
              ):
                  d.line(
                      (x,58,x,72),
                      fill=a,
                      width=3
                  )

              return im.rotate(
                  -35,
                  resample=
                  Image.Resampling.BICUBIC
              )

          for name,fn in {
              'tp-drug.png':drug,
              'tp-booster.png':booster,
              'tp-medical.png':medical
          }.items():
              fn().save(
                  name,
                  'PNG',
                  optimize=True
              )

          def clean(path):
              im=Image.open(
                  path
              ).convert(
                  'RGBA'
              )

              p=im.load()

              for y in range(
                  im.height
              ):
                  for x in range(
                      im.width
                  ):
                      r,g,b,a=p[x,y]
                      m=max(r,g,b)

                      if m<=28:
                          p[x,y]=(
                              r,
                              g,
                              b,
                              0
                          )

                      elif m<72:
                          p[x,y]=(
                              r,
                              g,
                              b,
                              round(
                                  a*
                                  (m-28)/
                                  44
                              )
                          )

              im.save(
                  path,
                  'PNG',
                  optimize=True
              )

          for f in (
              'tp-health.png',
              'tp-energy.png',
              'tp-happiness.png'
          ):
              if Path(f).exists():
                  clean(f)

          cfg=Path(
              'app.config.js'
          ).read_text()

          m=re.search(
              r'const OVERLAY_SERVICE_KT = ("(?:\\.|[^"\\])*");',
              cfg
          )

          if not m:
              raise SystemExit(
                  'OVERLAY_SERVICE_KT not found'
              )

          kt=json.loads(
              m.group(1)
          )

          mapping={
              'TP_DRUG_ICON':
              'tp-drug.png',

              'TP_BOOSTER_ICON':
              'tp-booster.png',

              'TP_MEDICAL_ICON':
              'tp-medical.png',

              'TP_HEALTH_ICON':
              'tp-health.png',

              'TP_ENERGY_ICON':
              'tp-energy.png',

              'TP_HAPPINESS_ICON':
              'tp-happiness.png'
          }

          for key,f in mapping.items():
              if not Path(f).exists():
                  continue

              data=base64.b64encode(
                  Path(f).read_bytes()
              ).decode()

              pat=re.compile(
                  r'(private val '
                  +re.escape(key)
                  +r' = ")([A-Za-z0-9+/=]+)(")'
              )

              if not pat.search(kt):
                  raise SystemExit(
                      key+
                      ' not found'
                  )

              kt=pat.sub(
                  lambda z:
                  z.group(1)
                  +data
                  +z.group(3),
                  kt,
                  count=1
              )

          cfg=(
              cfg[:m.start(1)]
              +json.dumps(kt)
              +cfg[m.end(1):]
          )

          Path(
              'app.config.js'
          ).write_text(cfg)

          print(
              '✓ Drug=leaf • Booster=bottle • Medical=syringe'
          )
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/tornpulse-check

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      - name: Hide Android navigation bar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path(
              'android/app/src/main/java/com/comfortableai/torncopilot/MainActivity.kt'
          )

          s=p.read_text()

          if 'TORNPULSE_IMMERSIVE_NAV_RC7' not in s:
              e=s.find(
                  '\n',
                  s.find('package ')
              )

              s=(
                  s[:e+1]
                  +'import androidx.core.view.WindowCompat\n'
                  +'import androidx.core.view.WindowInsetsCompat\n'
                  +'import androidx.core.view.WindowInsetsControllerCompat\n'
                  +s[e+1:]
              )

              end=s.rfind(
                  '\n}'
              )

              code='''
            // TORNPULSE_IMMERSIVE_NAV_RC7
            private fun applyTornPulseNav() {
              val c =
                WindowCompat.getInsetsController(
                  window,
                  window.decorView
                )

              c.hide(
                WindowInsetsCompat.Type.navigationBars()
              )

              c.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }

            override fun onWindowFocusChanged(
              hasFocus: Boolean
            ) {
              super.onWindowFocusChanged(
                hasFocus
              )

              if (hasFocus) {
                applyTornPulseNav()
              }
            }
          '''

              s=(
                  s[:end]
                  +code
                  +s[end:]
              )

              s=s.replace(
                  'super.onCreate(null)',
                  'super.onCreate(null)\n    window.decorView.post { applyTornPulseNav() }',
                  1
              )

              p.write_text(s)
          PY

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tornpulse-v2.0.0-rc7-fixed-cooldown-icons-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
