name: Build Torn Pulse Market V1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Market V1 source
        run: |
          test -f App.js
          test -f src/api.js
          test -f src/marketCore.js
          test -f src/storage.js
          test -f scripts/self-test.cjs

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run market self-test
        run: npm run selftest

      - name: Validate JavaScript bundle
        run: npx expo export --platform android

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: torn-pulse-market-v1-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
